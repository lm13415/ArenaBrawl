function drawBlock(r,top,hi,front,detail){
  const d=11;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(r.x+r.w/2+4,r.y+r.h+d+2,r.w*0.55,8,0,0,TAU); ctx.fill();
  rrPath(r.x,r.y+4,r.w,r.h+d-4,6); ctx.fillStyle=front; ctx.fill();
  rrPath(r.x,r.y,r.w,r.h,6); ctx.fillStyle=top; ctx.fill();
  rrPath(r.x+3,r.y+3,r.w-6,Math.min(10,r.h*0.18),4); ctx.fillStyle=hi; ctx.fill();
  if(detail) detail();
  ctx.lineWidth=3; ctx.strokeStyle='#14110f'; ctx.lineJoin='round';
  rrPath(r.x,r.y,r.w,r.h+d,6); ctx.stroke();
  ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(r.x+2,r.y+r.h); ctx.lineTo(r.x+r.w-2,r.y+r.h); ctx.stroke();
  ctx.restore();
}
function drawBush(r){
  ctx.save();
  rrPath(r.x,r.y,r.w,r.h,18); ctx.clip();
  ctx.fillStyle='#2b8a3b'; ctx.fillRect(r.x,r.y,r.w,r.h);
  let sd=((r.x*13+r.y*7)|0)||1;
  const rnd=()=>{ sd=(sd*1664525+1013904223)|0; return ((sd>>>8)&0xffff)/65535; };
  const greens=['#3fae4f','#4cc15c','#35a046','#58cf68'];
  const n=Math.round(r.w*r.h/650);
  for(let k=0;k<n;k++){
    const x=r.x+rnd()*r.w, y=r.y+rnd()*r.h, rad=13+rnd()*12;
    ctx.beginPath(); ctx.arc(x,y,rad,0,TAU); ctx.fillStyle=greens[k%4]; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(8,60,20,.55)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(x-rad*0.3,y-rad*0.35,rad*0.38,0,TAU); ctx.fillStyle='rgba(190,255,200,.28)'; ctx.fill();
  }
  ctx.restore();
  rrPath(r.x,r.y,r.w,r.h,18); ctx.lineWidth=4; ctx.strokeStyle='#103f1a'; ctx.stroke();
}
function drawObstacle(r){
  const type=r.type||'crate';
  if(type==='bush'){ drawBush(r); return; }
  if(type==='rock'){
    drawBlock(r,'#9aa3b5','rgba(255,255,255,.3)','#646c80',()=>{
      ctx.strokeStyle='rgba(20,20,30,.35)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(r.x+r.w*0.2,r.y+r.h*0.15); ctx.lineTo(r.x+r.w*0.5,r.y+r.h*0.45); ctx.lineTo(r.x+r.w*0.4,r.y+r.h*0.8);
      ctx.moveTo(r.x+r.w*0.7,r.y+r.h*0.25); ctx.lineTo(r.x+r.w*0.82,r.y+r.h*0.6); ctx.stroke();

      const parts=Math.max(2,Math.round(r.w/34));

      for(const [ox,oy] of [[7,7],[r.w-7,7],[7,r.h-7],[r.w-7,r.h-7]]){ ctx.beginPath(); ctx.arc(r.x+ox,r.y+oy,2.2,0,TAU); ctx.fill(); }
    });
  }

const THEMES={
  showdown:{a:'#e3bf78',b:'#d8b06a',line:'rgba(120,80,20,.12)',decor:'#b58d49',grass:false},
  gemgrab: {a:'#76629f',b:'#6c5a96',line:'rgba(25,10,60,.20)',decor:'#52427a',grass:false},
  knockout:{a:'#8cbd5b',b:'#82b351',line:'rgba(30,70,10,.13)',decor:'#5f9238',grass:true},
  hotzone: {a:'#62b0a6',b:'#58a79d',line:'rgba(10,60,60,.15)',decor:'#3f8a82',grass:true},
  brawlball:{a:'#79c566',b:'#6fbb5c',line:'rgba(20,80,20,.13)',decor:'#4f9a42',grass:true}
};
function drawBackground(){
  const th=THEMES[mode]||THEMES.showdown;
  ctx.fillStyle=th.a; ctx.fillRect(0,0,W,H);
  const tile=100;
  ctx.fillStyle=th.b;
  for(let ty=0; ty<H; ty+=tile){
    for(let tx=0; tx<W; tx+=tile){
      if(((tx/tile|0)+(ty/tile|0))%2===0) ctx.fillRect(tx,ty,tile,tile);
    }
  }
  ctx.strokeStyle=th.line; ctx.lineWidth=2;
  for(let x=0;x<=W;x+=tile){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=tile){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(const d of getDecor()){
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
    if(th.grass){
      ctx.strokeStyle=th.decor; ctx.lineWidth=2; ctx.lineCap='round';
      for(const a of [-0.5,0,0.5]){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.sin(a)*7,-8-Math.abs(a)*-3); ctx.stroke(); }
    } else {
      ctx.fillStyle=th.decor; ctx.beginPath(); ctx.ellipse(0,0,d.r*1.6,d.r,0,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  if(mode==='brawlball'){
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=5;
    ctx.strokeRect(16,16,W-32,H-32);
    ctx.beginPath(); ctx.moveTo(CX,16); ctx.lineTo(CX,H-16); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX,CY,90,0,TAU); ctx.stroke();
    ctx.strokeRect(16,CY-170,150,340); ctx.strokeRect(W-166,CY-170,150,340);
  }
  for(const r of activePillars) drawObstacle(r);
  for(const r of activeBushes) drawObstacle(r);
  ctx.fillStyle=getWorldVignette(); ctx.fillRect(0,0,W,H);
  // dark frame around the arena
  ctx.strokeStyle='rgba(20,14,8,.55)'; ctx.lineWidth=20; ctx.strokeRect(0,0,W,H);
  ctx.strokeStyle='#14110f'; ctx.lineWidth=4; ctx.strokeRect(10,10,W-20,H-20);
}
function drawStormFog(){
  const ts=STORM_TS, z=stormZone(), now=performance.now();
  if(!isFinite(z.hw)||!isFinite(z.hh)) return;
  const i0=Math.floor((camera.x-CX)/ts)-1, i1=Math.ceil((camera.x+VIEWPORT_W-CX)/ts)+1;
  const j0=Math.floor((camera.y-CY)/ts)-1, j1=Math.ceil((camera.y+VIEWPORT_H-CY)/ts)+1;
  const n=Math.round(z.hw/ts-0.5), m=Math.round(z.hh/ts-0.5);
  ctx.save();
  for(let i=i0;i<=i1;i++){
    for(let j=j0;j<=j1;j++){
      if(Math.abs(i)<=n && Math.abs(j)<=m) continue;
      const x=CX+i*ts-ts/2, y=CY+j*ts-ts/2;
      if(x+ts<0||y+ts<0||x>W||y>H) continue;
      const h=((i*73856093)^(j*19349663))&255;
      const wv=Math.sin(now/700+h*0.7);
      const edge=(Math.abs(i)<=n+1 && Math.abs(j)<=m+1);
      ctx.fillStyle='rgba(100,190,40,'+(0.38+0.1*wv+(edge?0.08:0)).toFixed(3)+')';
      ctx.fillRect(x+1,y+1,ts-2,ts-2);
      const o=3+3*Math.sin(now/900+h);
      ctx.fillStyle='rgba(190,255,110,'+(0.10+0.07*Math.sin(now/450+h)).toFixed(3)+')';
      ctx.fillRect(x+6+o,y+6-o*0.5,ts-18,ts-18);
    }
  }
  ctx.shadowColor='#9be83a'; ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(168,240,70,.9)'; ctx.lineWidth=3;
  ctx.strokeRect(CX-z.hw,CY-z.hh,z.hw*2,z.hh*2);
  ctx.restore();
}

      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.traveled*0.08);
      withGlow(p.color,13,()=>{
        ctx.fillStyle=p.color; ctx.beginPath();
        for(let i=0;i<4;i++){ const a=i/4*TAU; ctx.lineTo(Math.cos(a)*6.5,Math.sin(a)*6.5); ctx.lineTo(Math.cos(a+Math.PI/4)*2.5,Math.sin(a+Math.PI/4)*2.5); }
        ctx.closePath(); ctx.fill();
      });
      ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
      break;
    case 'frost': {
      // spinning hexagonal hex orb
      drawTrail(p,3,p.color,0.45,12,null);
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(now/220);
      const hex=(r)=>{ ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); };
      withGlow(p.color,14,()=>{ hex(7.5); ctx.fillStyle='rgba(194,24,91,.35)'; ctx.fill(); ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.stroke(); });
      hex(3.5); ctx.fillStyle='#ffd1e6'; ctx.fill();
      ctx.restore();
      break;
    }
    default:
      drawTrail(p,5,p.color,0.55,14,'#ffffff');
      drawOrb(p.x,p.y,5,p.color,12);

}
function drawProjectiles(){
  for(const p of projectiles){
    if(p.arc) drawLob(p); else drawBolt(p);
  }
}
function drawParticles(){
  ctx.save();
  ctx.shadowBlur=6;
  for(const pt of particles){
    if(pt.puff){
      ctx.shadowBlur=0;
      ctx.globalAlpha=Math.max(0,pt.life/pt.maxLife)*0.45;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.radius,0,TAU);
      ctx.fillStyle=pt.color; ctx.fill(); ctx.globalAlpha=1;
      ctx.shadowBlur=6;
      continue;
    }
    ctx.shadowColor=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.radius,0,TAU);
    ctx.fillStyle=pt.color; ctx.globalAlpha=Math.max(0,pt.life/pt.maxLife); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawDebris(){
  for(const d of debris){
    const a=Math.min(1,d.life/0.4);
    ctx.save();
    ctx.globalAlpha=a*0.4; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(d.x,d.y,d.size*0.9,d.size*0.4,0,0,TAU); ctx.fill();
    ctx.globalAlpha=a; ctx.translate(d.x,d.y-d.z); ctx.rotate(d.rot);
    ctx.fillStyle=d.color; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-d.size,-d.size*0.6); ctx.lineTo(d.size*0.9,-d.size*0.8); ctx.lineTo(d.size,d.size*0.5); ctx.lineTo(-d.size*0.4,d.size); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
function drawTopFX(){
  for(const f of topFX){
    const prog=Math.max(0,Math.min(1,1-f.timer/f.maxTimer));
    ctx.save();
    ctx.globalAlpha=1-prog;
    if(f.kind==='spark'){
      ctx.translate(f.x,f.y);
      ctx.shadowColor=f.color; ctx.shadowBlur=12;
      ctx.strokeStyle=f.color; ctx.lineWidth=2; ctx.lineCap='round';
      for(let i=0;i<7;i++){
        const a=f.seed+i/7*TAU, r0=f.size*(0.25+prog*0.9), r1=f.size*(0.6+prog*1.4);
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0); ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1); ctx.stroke();
      }
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,f.size*0.35*(1-prog),0,TAU); ctx.fill();
    } else if(f.kind==='zap'){
      ctx.shadowColor=f.color; ctx.shadowBlur=14;
      ctx.strokeStyle='#e6f6ff'; ctx.lineWidth=2.5*(1-prog)+0.8; ctx.lineCap='round'; ctx.lineJoin='round';
      const dx=f.x2-f.x, dy=f.y2-f.y, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
      ctx.beginPath(); ctx.moveTo(f.x,f.y);
      for(let k=1;k<7;k++){
        const t=k/7, j=Math.sin(f.seed*100+k*12.9)*9;
        ctx.lineTo(f.x+dx*t+nx*j,f.y+dy*t+ny*j);
      }
      ctx.lineTo(f.x2,f.y2); ctx.stroke();
    } else if(f.kind==='frag'){
      ctx.translate(f.x,f.y);
      ctx.shadowColor='#ff9b3a'; ctx.shadowBlur=10;
      ctx.strokeStyle='#ffd36b'; ctx.lineCap='round'; ctx.lineWidth=2.5*(1-prog)+0.8;
      ctx.lineWidth=4.5*(1-prog)+1.2;
      for(let k=0;k<4;k++){
        const a=k*Math.PI/2;
        const r0=f.size*(0.1+prog*1.1), r1=r0+f.size*0.5*(1-prog)+6;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0); ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1); ctx.stroke();
      }
    } else {
      ctx.translate(f.x,f.y); ctx.rotate(f.angle);
      ctx.shadowColor=f.color; ctx.shadowBlur=14;
      const len=f.size*(0.5+prog*0.7);
      if(f.type==='cone'){
        const g=ctx.createLinearGradient(0,0,len,0);
        g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(0.45,f.color); g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g;
        const w=Math.tan(f.half)*len;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,-w); ctx.lineTo(len*1.05,0); ctx.lineTo(len,w); ctx.closePath(); ctx.fill();
      } else if(f.type==='spike'){
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(len*0.4,-3.2); ctx.lineTo(len*1.3,0); ctx.lineTo(len*0.4,3.2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle=f.color; ctx.lineWidth=2; ctx.stroke();
      } else {
        ctx.strokeStyle='#fff'; ctx.lineWidth=2.2; ctx.lineCap='round';
        const angs=[0,-0.7,0.7,-1.4,1.4], lens=[1,0.7,0.7,0.4,0.4];
        for(let k=0;k<5;k++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(angs[k])*len*lens[k],Math.sin(angs[k])*len*lens[k]); ctx.stroke(); }
      }
    }
    ctx.restore();
  }
}
function drawFloatingTexts(){

function drawHUD(){

      else if(k===player.ammo && regen>0.05){ rrPath(x0,ay,Math.max(5,segW*regen),14,5); ctx.fillStyle='#ffa733'; ctx.fill(); }
    }
    // super button (bottom right)

function drawMinimap(){
  if(!isFinite(W)||!isFinite(H)) return;
  const mw=150, mh=Math.round(150*H/W), mx=VIEWPORT_W-mw-12, my=12, sx=mw/W, sy=mh/H;
  const th=THEMES[mode]||THEMES.showdown;
  ctx.save();
  rrPath(mx-3,my-3,mw+6,mh+6,8); ctx.fillStyle='rgba(8,12,28,.75)'; ctx.fill();
  ctx.beginPath(); ctx.rect(mx,my,mw,mh); ctx.clip();
  ctx.fillStyle=th.a; ctx.fillRect(mx,my,mw,mh);
  if(stormActive()){
    const z=stormZone();
    if(isFinite(z.hw)){
      ctx.fillStyle='rgba(90,175,30,.65)'; ctx.fillRect(mx,my,mw,mh);
      ctx.fillStyle=th.a; ctx.fillRect(mx+(CX-z.hw)*sx,my+(CY-z.hh)*sy,z.hw*2*sx,z.hh*2*sy);
    }
  }
  ctx.fillStyle='rgba(30,110,40,.7)';
  for(const r of activeBushes) ctx.fillRect(mx+r.x*sx,my+r.y*sy,Math.max(2,r.w*sx),Math.max(2,r.h*sy));
  ctx.fillStyle='rgba(30,24,20,.7)';
  for(const r of activePillars) ctx.fillRect(mx+r.x*sx,my+r.y*sy,Math.max(2,r.w*sx),Math.max(2,r.h*sy));
  for(const e of entities){
    if(!e.alive) continue;
    if(e!==player && player && player.alive && !canSense(player,e) && relationColor(e)==='#ff4d4d') continue;
    ctx.fillStyle=relationColor(e);
    const r=e===player?3.6:(e.isMinion?1.8:2.6);
    ctx.beginPath(); ctx.arc(mx+e.x*sx,my+e.y*sy,r,0,TAU); ctx.fill();
    if(e===player){ ctx.lineWidth=1.2; ctx.strokeStyle='#fff'; ctx.stroke(); }
  }
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.8)';
  ctx.strokeRect(mx+camera.x*sx,my+camera.y*sy,VIEWPORT_W*sx,VIEWPORT_H*sy);
  ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle='#14110f'; rrPath(mx-1,my-1,mw+2,mh+2,6); ctx.stroke();
}
function drawKillFeed(){

let spectateId=null;
function getSpectateTarget(){
  if(!player || player.alive || mode!=='knockout') return null;
  let t=entities.find(e=>e.id===spectateId && e.alive);
  if(!t){
    const alive=entities.filter(e=>e.alive&&!e.isMinion);
    t=alive.find(e=>e.team===player.team) || alive[0] || null;
    spectateId=t?t.id:null;
  }
  return t;
}
function updateCamera(){
  const spec=getSpectateTarget();
  const focus = spec || player || {x:CX,y:CY};
  let fx=focus.x, fy=focus.y;
  if(!spec && player && player.alive){ fx+=Math.cos(player.angle)*45; fy+=Math.sin(player.angle)*45; }
  const tx=Math.max(0, Math.min(W-VIEWPORT_W, fx-VIEWPORT_W/2));
  const ty=Math.max(0, Math.min(H-VIEWPORT_H, fy-VIEWPORT_H/2));
  if(camSnap){ camera.x=tx; camera.y=ty; camSnap=false; }
  else { camera.x+=(tx-camera.x)*0.18; camera.y+=(ty-camera.y)*0.18; }
}
function draw(){
  updateCamera();
  ctx.clearRect(0,0,VIEWPORT_W,VIEWPORT_H);
  ctx.save();
  let shakeX=0, shakeY=0;
  if(shake.timer>0){ shakeX=rand(-shake.mag,shake.mag); shakeY=rand(-shake.mag,shake.mag); }
  ctx.translate(-camera.x+shakeX, -camera.y+shakeY);
  drawBackground();
  drawPoisonZones();
  drawModeExtras();
  drawCratesAndCubes();
  drawAimReticle();
  for(const e of entities) drawEntity(e);
  drawProjectiles();
  drawStrikes();
  drawDebris();
  drawParticles();
  drawTopFX();
  drawFloatingTexts();
  ctx.restore();
  drawHUD();
}

function drawAimReticle(){
  if(!player || !player.alive) return;
  const worldMouseX=mouse.x+camera.x, worldMouseY=mouse.y+camera.y;
  if(player.brawlerData.quake){
    ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle='rgba(255,220,150,.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(player.x,player.y,player.brawlerData.splash,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(255,220,150,.07)'; ctx.fill(); ctx.restore();
    return;
  }
  if(!player.brawlerData.arc){
    const b=player.brawlerData;
    const ang=Math.atan2(worldMouseY-player.y,worldMouseX-player.x);
    const range=b.range;
    ctx.save();
    ctx.translate(player.x,player.y); ctx.rotate(ang);
    const g=ctx.createLinearGradient(0,0,range,0);
    g.addColorStop(0,'rgba(255,255,255,.30)'); g.addColorStop(1,'rgba(255,255,255,.04)');
    ctx.fillStyle=g; ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1.5;
    if((b.pellets>=2 && b.spread>0) || b.cone){
      // cone for shotguns / spread weapons / Poco's fan
      const half=deg2rad((b.cone||b.spread)/2)+(b.cone?0:0.05);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,range,-half,half); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      // straight lane for single-line weapons
      const wd=b.hitR?b.hitR:(b.aoe?10:(b.burst?7:(b.range>=450?5:8)));
      const wd1=(b.hitR&&b.hitGrow)?b.hitR+b.hitGrow:wd;
      ctx.beginPath(); ctx.moveTo(player.radius+2,-wd); ctx.lineTo(range,-wd1); ctx.arc(range,0,wd1,-Math.PI/2,Math.PI/2); ctx.lineTo(player.radius+2,wd); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(worldMouseX-9,worldMouseY); ctx.lineTo(worldMouseX-3,worldMouseY);
    ctx.moveTo(worldMouseX+3,worldMouseY); ctx.lineTo(worldMouseX+9,worldMouseY);
    ctx.moveTo(worldMouseX,worldMouseY-9); ctx.lineTo(worldMouseX,worldMouseY-3);
    ctx.moveTo(worldMouseX,worldMouseY+3); ctx.lineTo(worldMouseX,worldMouseY+9);
    ctx.stroke();
    ctx.restore();
    return;
  }
  const rawDist=dist(player,{x:worldMouseX,y:worldMouseY});
  const land=Math.max(60,Math.min(player.brawlerData.range,rawDist));
  const ang=Math.atan2(worldMouseY-player.y,worldMouseX-player.x);
  const lx=player.x+Math.cos(ang)*land, ly=player.y+Math.sin(ang)*land;
  ctx.save();
  ctx.setLineDash([5,5]);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(player.x,player.y); ctx.lineTo(lx,ly); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(lx,ly,player.brawlerData.splash,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,120,60,.7)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='rgba(255,120,60,.12)'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(lx-8,ly); ctx.lineTo(lx+8,ly); ctx.moveTo(lx,ly-8); ctx.lineTo(lx,ly+8);
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}

//////////////////////// LOOP ////////////////////////
function loop(t){
  let dt=(t-lastTime)/1000; lastTime=t; dt=Math.max(0,Math.min(dt,0.05));
  if(hitStop>0){ hitStop-=dt; dt*=0.1; }
  if(gameState==='playing') update(dt);
  draw();
  if(gameState==='playing') requestAnimationFrame(loop);
}
draw();
initLobby();
</script>
