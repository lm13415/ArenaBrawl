<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arena Brawl</title>
<style>
  html,body{margin:0;padding:0;background:#0d0f14;color:#eef1f6;font-family:'Segoe UI',Arial,sans-serif;overflow:auto;}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;position:relative;padding:10px 0 34px;box-sizing:border-box;}
  canvas{background:#26314a;border:3px solid #ffb020;border-radius:6px;display:block;}
  #stage{position:relative;width:940px;height:600px;max-width:100%;}
  .overlay{position:absolute;top:0;left:0;width:940px;height:600px;background:rgba(10,12,18,0.94);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:6px;z-index:5;overflow-y:auto;padding:14px 0 10px;box-sizing:border-box;}
  h1{font-size:34px;letter-spacing:1px;color:#ffb020;margin:0 0 4px 0;text-shadow:0 2px 0 #7a4a00;}
  .sub{color:#9aa4b8;margin-bottom:10px;font-size:12px;}
  .section-label{color:#ffb020;font-size:13px;margin:8px 0 6px;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(5,88px);gap:6px;}
  .pick{background:#1c2230;border:2px solid #333d52;border-radius:6px;padding:5px 3px;cursor:pointer;text-align:center;color:#dfe4ee;font-size:10px;transition:all .12s;}
  .pick:hover{border-color:#ffb020;}
  .pick.sel{border-color:#ffb020;background:#3a2e10;box-shadow:0 0 10px rgba(255,176,32,.6);}
  .swatch{width:30px;height:30px;border-radius:50%;margin:0 auto 3px;border:2px solid rgba(255,255,255,.3);}
  .role{color:#7d879c;font-size:8px;display:block;margin-top:2px;}
  .modes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:680px;}
  .modebtn{background:#1c2230;border:2px solid #333d52;border-radius:6px;padding:10px 14px;cursor:pointer;color:#dfe4ee;font-size:13px;}
  .modebtn:hover{border-color:#23e6a8;}
  .modebtn.sel{border-color:#23e6a8;background:#0f3329;box-shadow:0 0 10px rgba(35,230,168,.6);}
  #startBtn{margin-top:14px;padding:12px 36px;font-size:18px;font-weight:700;background:#ffb020;border:none;border-radius:6px;color:#1a1200;cursor:pointer;}
  #startBtn:hover{background:#ffc457;}
  #gameoverText{font-size:32px;color:#ffb020;margin-bottom:16px;}
  .again{padding:10px 28px;font-size:15px;background:#23e6a8;border:none;border-radius:6px;color:#00291d;font-weight:700;cursor:pointer;}
  .controls{color:#7d879c;font-size:12px;margin-top:14px;}
  .footer{position:absolute;bottom:-22px;left:0;right:0;text-align:center;color:#556;font-size:10px;}

  /* ---------- lobby / home screen ---------- */
  .overlay.lobby{padding:0;background:radial-gradient(circle at 50% 30%,#35a6ff 0%,#167cf0 45%,#0a52c8 100%);overflow:hidden;font-family:'Arial Black','Trebuchet MS',Arial,sans-serif;justify-content:flex-start;}
  .lobby::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 2px,transparent 3px);background-size:44px 44px;pointer-events:none;}
  .lobby .view{position:absolute;inset:0;}
  .lobby .view[hidden]{display:none;}
  .txt{color:#fff;text-shadow:-2px -2px 0 #0a1e4a,2px -2px 0 #0a1e4a,-2px 2px 0 #0a1e4a,2px 2px 0 #0a1e4a,0 3px 0 #0a1e4a;letter-spacing:.5px;}
  .ico svg{width:100%;height:100%;display:block;}
  .profile{position:absolute;left:10px;top:10px;display:flex;gap:8px;align-items:center;background:#0d3a8f;border:3px solid #06204f;border-radius:10px;padding:5px 12px 5px 6px;box-shadow:0 4px 0 #06204f;}
  .profile canvas{width:46px;height:46px;border-radius:8px;background:#2a7de1;border:2px solid #06204f;}
  .pname{font-size:15px;}
  .pbar{display:flex;align-items:center;gap:5px;color:#fff;font-size:14px;margin-top:2px;}
  .pbar .ico{width:18px;height:18px;display:inline-block;}
  .totalpill{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#0b2d70;border:3px solid #06183d;border-radius:20px;padding:4px 18px 4px 10px;color:#fff;font-size:20px;box-shadow:0 4px 0 #06183d;}
  .totalpill .ico{width:26px;height:26px;}
  .statpill{position:absolute;right:12px;top:14px;background:#0b2d70;border:3px solid #06183d;border-radius:16px;padding:6px 14px;font-size:13px;box-shadow:0 4px 0 #06183d;}
  .leftcol{position:absolute;left:12px;top:92px;display:flex;flex-direction:column;gap:14px;}
  .sidebtn{position:relative;width:96px;height:78px;border:3px solid #0a1e4a;border-radius:12px;background:linear-gradient(#56b4ff,#2a8af0);box-shadow:0 5px 0 #0a1e4a;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;font-size:11px;padding:0;}
  .sidebtn:hover{filter:brightness(1.12);}
  .sidebtn:active{transform:translateY(3px);box-shadow:0 2px 0 #0a1e4a;}
  .sidebtn .ico{width:34px;height:34px;}
  .sidebtn .lbl{text-shadow:-1px -1px 0 #0a1e4a,1px -1px 0 #0a1e4a,-1px 1px 0 #0a1e4a,1px 1px 0 #0a1e4a;}
  .notif{position:absolute;right:-8px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:#e5342a;border:2px solid #0a1e4a;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .hero{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:320px;height:380px;cursor:pointer;}
  .hero canvas{width:320px;height:380px;filter:drop-shadow(0 12px 6px rgba(0,30,90,.45));}
  .herotag{position:absolute;left:50%;top:408px;transform:translateX(-50%);text-align:center;width:420px;}
  .heroname{font-size:30px;line-height:1;}
  .herosub{color:#cfe6ff;font-size:12px;margin-top:5px;text-shadow:0 2px 0 #0a1e4a;}
  .herorank{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
  .prog{position:relative;width:160px;height:14px;background:#0a2a6c;border:2px solid #06183d;border-radius:8px;overflow:hidden;}
  .prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffa733,#f06a10);}
  .prog span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:11px;color:#fff;text-shadow:0 1px 0 #06183d;}
  .hex{display:flex;align-items:center;justify-content:center;color:#fff;font-family:inherit;background:var(--c,#888);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 2px 0 rgba(0,0,0,.55);flex:0 0 auto;}
  .bottombar{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 12px;gap:14px;}
  .modebar{flex:1;max-width:380px;height:72px;border:3px solid #0a1e4a;border-radius:12px;background:#10244d;box-shadow:0 5px 0 #0a1e4a;display:flex;align-items:center;gap:12px;padding:6px 14px 6px 6px;cursor:pointer;color:#fff;font-family:inherit;text-align:left;}
  .modebar:hover{filter:brightness(1.12);}
  .modeart{width:66px;height:58px;border-radius:8px;border:2px solid #06183d;background:#2fb55c;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .modeart svg{width:38px;height:38px;}
  .modetxt{display:flex;flex-direction:column;gap:2px;flex:1;}
  .modetxt small{font-size:9px;color:#9fc0ff;}
  .modetxt b{font-size:19px;}
  .modetxt span{font-size:11px;color:#ffdc7a;}
  .chev{font-size:22px;color:#9fc0ff;}
  #startBtn{width:240px;height:78px;margin:0;border-radius:12px;border:4px solid #3a2a00;background:linear-gradient(#ffdf45,#ffb000);box-shadow:0 6px 0 #7a4a00;color:#2a1a00;font-size:36px;font-family:inherit;cursor:pointer;}
  #startBtn:hover{background:linear-gradient(#ffe86a,#ffc01a);}
  #startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #7a4a00;}
  .hint{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:10px;color:#bcd9ff;font-family:Arial,sans-serif;white-space:nowrap;display:none;}
  .hdr{position:absolute;left:0;right:0;top:0;height:58px;background:linear-gradient(#0e3c96,#0a2f78);border-bottom:4px solid #06183d;display:flex;align-items:center;gap:14px;padding:0 10px;z-index:3;}
  .hbtn{width:64px;height:46px;border:3px solid #06183d;border-radius:8px;background:linear-gradient(#4a5775,#2d3750);box-shadow:0 4px 0 #06183d;cursor:pointer;padding:8px;}
  .hbtn:hover{filter:brightness(1.2);}
  .hbtn svg{width:100%;height:100%;}
  .htitle{font-size:26px;flex:0 0 auto;}
  .hsub{font-size:18px;color:#9fd0ff;flex:1;}
  .hsub b{color:#4aa8ff;}
  .hpill{margin-left:auto;display:flex;align-items:center;gap:8px;background:#0a2a6c;border:3px solid #06183d;border-radius:18px;padding:3px 14px 3px 8px;font-size:18px;color:#fff;}
  .hpill .ico{width:24px;height:24px;}
  .cards{position:absolute;left:0;right:0;top:62px;bottom:0;overflow-y:auto;padding:22px 14px 24px;display:grid;grid-template-columns:repeat(4,205px);gap:26px 14px;justify-content:center;align-content:start;}
  .bcard{position:relative;width:205px;height:148px;border:3px solid #06183d;border-radius:4px;background:#1b2a4d;cursor:pointer;box-shadow:0 5px 0 #06183d;overflow:visible;}
  .bcard:hover{filter:brightness(1.1);}
  .bcard.sel{outline:4px solid #ffe14a;}
  .bcard canvas{position:absolute;left:0;top:0;width:199px;height:106px;display:block;}
  .bcard .bname{position:absolute;right:6px;top:84px;font-size:16px;text-transform:uppercase;font-style:italic;}
  .bcard .bstrip{position:absolute;left:0;right:0;bottom:0;height:40px;background:#2c2f45;display:flex;align-items:center;gap:8px;padding:0 8px 0 36px;color:#fff;font-size:11px;}
  .bcard .bstrip .prog{width:auto;flex:1;height:16px;}
  .bcard .hex{position:absolute;left:-14px;bottom:-12px;width:44px;height:48px;font-size:22px;border:0;z-index:2;}
  .bcard .tpill{position:absolute;left:-6px;top:-12px;display:flex;align-items:center;gap:4px;background:#e26a00;border:2px solid #06183d;border-radius:5px;padding:2px 8px 2px 4px;color:#fff;font-size:13px;z-index:2;}
  .bcard .tpill .ico{width:16px;height:16px;}
  .modecards{position:absolute;left:0;right:0;top:62px;bottom:0;overflow-y:auto;padding:30px 24px;display:grid;grid-template-columns:repeat(3,270px);gap:26px 18px;justify-content:center;align-content:start;}
  .mcard{position:relative;height:150px;border:3px solid #06183d;border-radius:8px;cursor:pointer;box-shadow:0 5px 0 #06183d;overflow:hidden;color:#fff;}
  .mcard:hover{filter:brightness(1.1);}
  .mcard.sel{outline:4px solid #ffe14a;}
  .mcard .mtop{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(var(--a),var(--b));}
  .mcard .mtop .mi{width:46px;height:46px;flex:0 0 auto;}
  .mcard .mname{font-size:18px;line-height:1.05;}
  .mcard .mmap{font-size:11px;color:#fff;opacity:.9;text-shadow:0 2px 0 rgba(0,0,0,.5);}
  .mcard .mart{position:absolute;left:0;right:0;top:64px;bottom:0;background:linear-gradient(160deg,var(--b),#0d1330);overflow:hidden;}
  .mcard .mart svg{position:absolute;right:-14px;top:-10px;width:110px;height:110px;opacity:.22;}
  .mcard .mdesc{position:absolute;left:10px;right:10px;bottom:10px;font-family:Arial,sans-serif;font-weight:bold;font-size:11px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.7);}
  .road{position:absolute;left:0;right:0;top:62px;bottom:0;overflow-x:auto;overflow-y:hidden;}
  .roadin{position:relative;height:100%;}
  .rtile{position:absolute;top:96px;width:150px;height:150px;border:3px solid #06183d;border-radius:4px;background:linear-gradient(#18a0ff,#0a78e0);box-shadow:0 5px 0 #06183d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;}
  .rtile.done{background:linear-gradient(#ffe45c,#f0b020);}
  .rtile .rn{font-size:30px;}
  .rtile .rl{font-size:11px;}
  .rtile .ck{position:absolute;left:-10px;bottom:-8px;width:34px;height:34px;}
  .rbar{position:absolute;top:330px;height:36px;background:#4a0d36;border:3px solid #06183d;transform:skewX(-14deg);}
  .rfill{position:absolute;top:330px;height:36px;background:linear-gradient(#ff8a2a,#ee5a0a);border:3px solid #06183d;border-right:0;transform:skewX(-14deg);}
  .rtick{position:absolute;top:330px;height:36px;width:3px;background:rgba(255,255,255,.35);transform:skewX(-14deg);}
  .rnum{position:absolute;top:382px;width:100px;text-align:center;font-size:14px;color:#bfe0ff;text-shadow:0 2px 0 #06183d;}
  .rnum.done{color:#fff;}
  .rmark{position:absolute;top:296px;width:60px;height:70px;display:flex;flex-direction:column;align-items:center;}
  .rmark .hex{width:56px;height:62px;font-size:22px;}
  .rtag{position:absolute;top:404px;min-width:90px;height:36px;background:#f08a0a;border:3px solid #06183d;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:17px;padding:0 8px;}
  .rtag .ico{width:20px;height:20px;}
  .lobby canvas{border:0;border-radius:0;background:transparent;}
  .lobby .profile canvas{background:#2a7de1;border:2px solid #06204f;border-radius:8px;}
  /* ---------- result popup ---------- */
  #gameover{justify-content:center;gap:10px;background:rgba(6,16,46,.92);font-family:'Arial Black','Trebuchet MS',Arial,sans-serif;}
  #gameoverText{font-size:44px;margin-bottom:6px;color:#ffd53a;text-shadow:0 4px 0 #7a4a00;}
  #trophyLine{font-size:26px;color:#fff;display:flex;align-items:center;gap:10px;}
  #trophyLine .pos{color:#5dff7a;} #trophyLine .neg{color:#ff6b6b;} #trophyLine .ico{width:32px;height:32px;display:inline-block;}
  #rankLine{font-size:16px;color:#cfe6ff;margin-bottom:14px;text-align:center;min-height:22px;}
  #rankLine .up{color:#ffd53a;}
  .again{padding:14px 44px;font-size:22px;background:linear-gradient(#ffdf45,#ffb000);border:4px solid #3a2a00;box-shadow:0 5px 0 #7a4a00;border-radius:10px;color:#2a1a00;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <canvas id="c" width="940" height="600"></canvas>

  <div class="overlay lobby" id="menu">
    <div class="view" id="viewHome">
      <div class="profile">
        <canvas id="avatar" width="92" height="92"></canvas>
        <div class="pinfo"><div class="pname txt">Player</div><div class="pbar"><span class="ico" data-ico="trophy"></span><b id="pTroph">0</b></div></div>
      </div>
      <div class="totalpill"><span class="ico" data-ico="trophy"></span><b id="totalTroph">0</b></div>
      <div class="statpill txt" id="statPill">W 0 &nbsp;L 0</div>
      <div class="leftcol">
        <button class="sidebtn" id="btnBrawlers"><span class="ico" data-ico="people"></span><span class="lbl">BRAWLERS</span><i class="notif" id="brawlerCount">15</i></button>
        <button class="sidebtn" id="btnTrophy"><span class="ico" data-ico="road"></span><span class="lbl">TROPHY ROAD</span></button>
      </div>
      <div class="hero" id="hero"><canvas id="heroCanvas" width="640" height="760"></canvas></div>
      <div class="herotag">
        <div class="heroname txt" id="heroName">Name</div>
        <div class="herosub" id="heroSub"></div>
        <div class="herorank" id="heroRank"></div>
      </div>
      <div class="bottombar">
        <button class="modebar" id="btnModes"><div class="modeart" id="modeArt"></div><div class="modetxt"><small>SELECTED EVENT</small><b class="txt" id="modeName">Solo Showdown</b><span id="modeMap"></span></div><span class="chev">&#9656;</span></button>
        <button id="startBtn">PLAY</button>
      </div>
    </div>

    <div class="view" id="viewBrawlers" hidden>
      <div class="hdr"><button class="hbtn" data-back data-ico="back"></button><div class="htitle txt">BRAWLERS</div><div class="hsub txt" id="brawlersSub"></div><div class="hpill"><span class="ico" data-ico="trophy"></span><b id="brawlersTroph">0</b></div><button class="hbtn" data-back data-ico="home"></button></div>
      <div class="cards" id="brawlerCards"></div>
    </div>

    <div class="view" id="viewModes" hidden>
      <div class="hdr"><button class="hbtn" data-back data-ico="back"></button><div class="htitle txt">GAME MODES</div><div class="hsub txt">Pick an event to play</div><button class="hbtn" data-back data-ico="home"></button></div>
      <div class="modecards" id="modeCards"></div>
    </div>

    <div class="view" id="viewTrophy" hidden>
      <div class="hdr"><button class="hbtn" data-back data-ico="back"></button><div class="htitle txt">TROPHY ROAD</div><div class="hpill"><span class="ico" data-ico="trophy"></span><b id="roadTroph">0</b></div><button class="hbtn" data-back data-ico="home"></button></div>
      <div class="road" id="road"><div class="roadin" id="roadIn"></div></div>
    </div>
  </div>

  <div class="overlay" id="gameover" style="display:none;">
    <div id="gameoverText">You Win!</div>
    <div id="trophyLine"></div>
    <div id="rankLine"></div>
    <button class="again" id="againBtn">CONTINUE</button>
  </div>

  <div class="footer">Original fan-made arcade project &mdash; not affiliated with or depicting any third-party game.</div>
</div>
</div>

<script>
//////////////////////// WORLD ////////////////////////
const VIEWPORT_W=940, VIEWPORT_H=600;
let W=2200, H=1400, CX=1100, CY=700;

//////////////////////// DATA ////////////////////////
// role-based archetypes; the thrower/lobber is listed first as requested
const BRAWLERS = [
 {name:'Grom', role:'Thrower',       color:'#27ae60', hp:4900,  speed:2.3, pellets:1, spread:0,  dmg:2040, range:360, projSpeed:7,  reload:1.6, ammoMax:3, radius:15, aoe:true,  splash:72, arc:true,  splitCount:4, splitGen:1, super:'Big Lob',      superDesc:'A much bigger version of his throw, which splits twice over'},
 {name:'Shelly',   role:'Shotgunner',    color:'#e056fd', hp:5600,  speed:2.6, pellets:5, spread:28, dmg:500, range:180, projSpeed:9,  reload:1.0, ammoMax:3, radius:16, aoe:false, splash:0,  arc:false, super:'Super Shell', superDesc:'A huge shotgun blast that knocks enemies back'},
 {name:'Jessie',   role:'Engineer',       color:'#3498db', hp:4600,  speed:2.5, pellets:1, spread:0,  dmg:1100, range:300, projSpeed:11, reload:1.0, ammoMax:3, radius:14, aoe:false, splash:0,  arc:false, bounces:2, chain:true, super:'Scrappy', superDesc:'Builds a turret that shoots nearby enemies for 14 seconds'},
 {name:'Poco',     role:'Healer',         color:'#9b59b6', hp:4800,  speed:2.5, pellets:1, spread:0,  dmg:900, range:330, projSpeed:11,  reload:0.9, ammoMax:3, radius:14, aoe:false, splash:0,  arc:false, pierceShot:true, cone:65, heals:0.6, super:'Encore', superDesc:'A huge healing wave that restores a big chunk of health to nearby allies'},
 {name:'Leon',     role:'Assassin',       color:'#a3cb38', hp:4400,  speed:3.0, pellets:4, spread:14, stagger:0.07, dmg:600, range:280, projSpeed:11, reload:1.1, ammoMax:3, radius:14, aoe:false, splash:0,  arc:false, super:'Smoke Bomb', superDesc:'Vanishes in a cloud of smoke for 5 seconds and runs faster; attacks from the smoke hit 25% harder'},
 {name:'Jackie', role:'Tank',          color:'#7f8c8d', hp:10400, speed:2.15,pellets:1, spread:0,  dmg:2400,  range:120,  projSpeed:14, reload:0.75,ammoMax:4, radius:20, aoe:true,  splash:120, arc:false, quake:true, super:'Gravity Slam', superDesc:'Sucks every nearby enemy in right next to her and slams them'},
 {name:'Nita',     role:'Summoner',       color:'#e67e22', hp:5000,  speed:2.5, pellets:1, spread:0,  dmg:1000, range:240, projSpeed:9,  reload:0.9, ammoMax:3, radius:15, aoe:false, splash:0,  arc:false, pierceShot:true, hitR:20, super:'Bear Summon', superDesc:'Calls in a big bear that fights for her until it is defeated'},
 {name:'Brock',    role:'Rocketeer',      color:'#f1c40f', hp:4300,  speed:2.4, pellets:1, spread:0,  dmg:1700, range:460, projSpeed:9,  reload:1.5, ammoMax:3, radius:14, aoe:true,  splash:50, arc:false, accel:1.2, super:'Rocket Rain', superDesc:'Calls down a barrage of 6 rockets on a target area'},

function loadSave(){
  try{ const t=localStorage.getItem(SAVE_KEY); if(t){ const d=JSON.parse(t); save=Object.assign(save,d); if(!save.trophies) save.trophies={}; } }catch(e){}
}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }
function rankOf(t){ return 1+Math.floor(t/250); }
function trophiesOf(name){ return save.trophies[name]||0; }
function totalTrophies(){ return BRAWLERS.reduce((a,b)=>a+trophiesOf(b.name),0); }
const SHOWDOWN_DELTAS=[10,8,6,4,2,0,-2,-4,-6,-8];
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function awardTrophies(name,delta){
  const before=trophiesOf(name), after=Math.max(0,before+delta);
  save.trophies[name]=after;
  persist();
  return {before,after,delta:after-before,rankBefore:rankOf(before),rankAfter:rankOf(after)};
}
const RANK_COLORS=['#8d97ab','#47ad4a','#3d8bd9','#9b59d6','#e08a1e','#e0462f','#f1c40f'];
function rankColor(r){ return RANK_COLORS[Math.min(RANK_COLORS.length-1,r-1)]; }
function hexHTML(rank,w,h,fs){ return '<div class="hex" style="--c:'+rankColor(rank)+';width:'+w+'px;height:'+h+'px;font-size:'+fs+'px">'+rank+'</div>'; }
function progHTML(t){ const m=t%250; return '<div class="prog"><i style="width:'+(m/250*100)+'%"></i><span>'+m+' / 250</span></div>'; }

// draw a brawler's face/body onto any small canvas (used for portraits)
function renderPortrait(cv,b,scale,cx,cy,rot,bg,torso){
  const g=cv.getContext('2d'), old=ctx;
  ctx=g;
  try{
    g.clearRect(0,0,cv.width,cv.height);
    if(bg){ bg(g,cv); }
    if(torso){
      g.save(); g.translate(cx,cy); g.scale(scale,scale);
      g.lineWidth=2.2; g.strokeStyle='#14110f';
      g.fillStyle=shade(b.color,-0.3);
      g.beginPath(); g.ellipse(-b.radius*1.35,b.radius*1.75,b.radius*0.5,b.radius*0.75,0.3,0,TAU); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(b.radius*1.35,b.radius*1.75,b.radius*0.5,b.radius*0.75,-0.3,0,TAU); g.fill(); g.stroke();
      g.fillStyle=shade(b.color,-0.2);
      g.beginPath(); g.ellipse(0,b.radius*1.9,b.radius*1.3,b.radius*1.1,0,0,TAU); g.fill(); g.stroke();
      g.restore();
    }
    g.save(); g.translate(cx,cy); g.scale(scale,scale); g.rotate(rot);
    drawWeaponShape(b,false);
    drawHead({radius:b.radius,brawlerData:b},false);
    g.restore();
  } finally { ctx=old; }
}

function shade(hex,amt){ // amt <0 darker
  let c=hex.replace('#',''); const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),bl=parseInt(c.substr(4,2),16);
  const f=v=>Math.max(0,Math.min(255,Math.round(v+(amt<0?v*amt:(255-v)*amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(bl)+')';
}
function buildBrawlerCards(){
  const box=document.getElementById('brawlerCards'); box.innerHTML='';
  const order=BRAWLERS.map((b,i)=>i).sort((a,b)=>trophiesOf(BRAWLERS[b].name)-trophiesOf(BRAWLERS[a].name)||a-b);
  for(const i of order){
    const b=BRAWLERS[i], tr=trophiesOf(b.name), rk=rankOf(tr);
    const card=document.createElement('div'); card.className='bcard'+(i===selectedBrawler?' sel':'');
    card.innerHTML='<canvas width="398" height="212"></canvas><div class="tpill"><span class="ico">'+ICONS.trophy+'</span><b>'+tr+'</b></div><div class="bname txt">'+b.name+'</div><div class="bstrip">'+progHTML(tr)+'</div>'+hexHTML(rk,44,48,22);
    box.appendChild(card);
    const cv=card.querySelector('canvas');
    renderPortrait(cv,b,4.2,200,112,Math.PI/2.45,(g,c)=>{
      const g1=g.createLinearGradient(0,0,c.width,c.height);
      g1.addColorStop(0,shade(b.color,0.25)); g1.addColorStop(0.6,shade(b.color,-0.1)); g1.addColorStop(0.6,shade(b.color,-0.45)); g1.addColorStop(1,shade(b.color,-0.55));
      g.fillStyle=g1; g.fillRect(0,0,c.width,c.height);

const ROAD_MS=[0,10,25,50,100,150,200,300,400,500,650,800,1000,1250,1500,2000,2500,3000,4000,5000,6000,7500,10000];
function buildTrophyRoad(){
  const t=totalTrophies(), SP=170, X0=130;
  const inner=document.getElementById('roadIn');
  inner.style.width=(X0*2+(ROAD_MS.length-1)*SP)+'px';
  let idx=0; while(idx<ROAD_MS.length-1 && t>=ROAD_MS[idx+1]) idx++;
  const mx = idx>=ROAD_MS.length-1 ? X0+idx*SP : X0+idx*SP+(t-ROAD_MS[idx])/(ROAD_MS[idx+1]-ROAD_MS[idx])*SP;
  let h='<div class="rbar" style="left:'+(X0-30)+'px;width:'+((ROAD_MS.length-1)*SP+60)+'px"></div>';
  h+='<div class="rfill" style="left:'+(X0-30)+'px;width:'+Math.max(0,mx-X0+30)+'px"></div>';
  for(let i=0;i<ROAD_MS.length;i++){
    const m=ROAD_MS[i], x=X0+i*SP, done=t>=m;
    h+='<div class="rtick" style="left:'+x+'px"></div>';
    h+='<div class="rnum'+(done?' done':'')+'" style="left:'+(x-50)+'px">'+m+'</div>';
    if(i>0) h+='<div class="rtile'+(done?' done':'')+'" style="left:'+(x-75)+'px"><span class="ico" style="width:46px;height:46px">'+ICONS.star+'</span><div class="rn txt">'+m+'</div><div class="rl txt">TROPHIES</div>'+(done?'<span class="ico ck">'+ICONS.check+'</span>':'')+'</div>';
  }
  h+='<div class="rmark" style="left:'+(mx-28)+'px"><div class="hex" style="--c:#7a3fd1;width:56px;height:62px"><span class="ico" style="width:30px;height:30px;display:block">'+ICONS.trophy+'</span></div></div>';
  h+='<div class="rtag" style="left:'+(mx-45)+'px"><span class="ico">'+ICONS.trophy+'</span><b>'+t+'</b></div>';
  inner.innerHTML=h;
  document.getElementById('roadTroph').textContent=t;
  const road=document.getElementById('road'); road.scrollLeft=Math.max(0,mx-320);
}

  mouse.x=(e.clientX-r.left)*(canvas.width/r.width);
  mouse.y=(e.clientY-r.top)*(canvas.height/r.height);
});
canvas.addEventListener('mousedown',()=>mouse.down=true);
window.addEventListener('mouseup',()=>mouse.down=false);

//////////////////////// HELPERS ////////////////////////
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function deg2rad(d){return d*Math.PI/180;}
function rand(a,b){return a+Math.random()*(b-a);}
function pointInRect(px,py,r){return px>r.x&&px<r.x+r.w&&py>r.y&&py<r.y+r.h;}
function randomBrawler(){return Math.floor(Math.random()*BRAWLERS.length);}
function triggerShake(mag,dur){ shake.mag=mag; shake.timer=dur; }
function spawnParticles(x,y,color,count,spd){
  spd=spd||120;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=rand(spd*0.3,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.6),maxLife:0.6,color,radius:rand(2,4)});
  }
}
function spawnFloatText(x,y,text,color,size){
  floatingTexts.push({x,y,text,life:0.8,maxLife:0.8,vy:-42,color:color||'#fff',size:size||13});
}
function ringFX(x,y,color,maxR,thick){
  groundEffects.push({x,y,r:6,maxR:maxR||80,timer:0.4,maxTimer:0.4,ring:true,color:color||'#fff',thick:thick||3});
}
// a quick bright radial flash — used for muzzle flashes and super detonations
function novaFX(x,y,color,maxR,dur){
  groundEffects.push({x,y,r:2,maxR:maxR||60,timer:dur||0.22,maxTimer:dur||0.22,nova:true,color:color||'#fff'});
}
function withGlow(color,blur,fn){
  ctx.save();
  ctx.shadowColor=color;
  ctx.shadowBlur=blur;
  fn();
  ctx.restore();
}


const TAU=Math.PI*2;
// soft smoke / dust puff that grows as it fades
function spawnPuff(x,y,color,count,spd,size,life){
  for(let i=0;i<count;i++){
    const a=Math.random()*TAU, v=rand(spd*0.3,spd);
    const r=size*rand(0.6,1);
    particles.push({x:x+rand(-4,4),y:y+rand(-4,4),vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life,maxLife:life,color,radius:r,grow:size*1.3/life,puff:true});
  }
}
// chunks of rock that fly up and bounce
function spawnDebris(x,y,color,count,spd,smin,smax,life){
  for(let i=0;i<count;i++){
    const a=Math.random()*TAU, v=rand(spd*0.3,spd);
    debris.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:0,vz:rand(120,300)*(spd>100?1:0.4),rot:Math.random()*TAU,vr:rand(-9,9),size:rand(smin||3,smax||6),life:life||1,color,bounced:false});
  }
}
// impact burst drawn on top of everything
function fragFX(x,y,size){
  topFX.push({kind:'frag',x,y,size:size||60,seed:Math.random()*TAU,timer:0.3,maxTimer:0.3});
}
function sparkFX(x,y,color,size){
  topFX.push({kind:'spark',x,y,color,size:size||12,seed:Math.random()*TAU,timer:0.2,maxTimer:0.2});
}
function muzzleFX(e,b,angle,x,y){
  spawnParticles(x,y,'#fff3d1',4,100);
  let type='star',size=26,half=0.4;
  if(b.arc || b.name==='Brock') type='puff';
  else if(b.pellets>=4){type='cone';size=64;half=0.55;}
  else if(b.pellets>=2){type='cone';size=40;half=0.3;}
  else if(b.range>=450){type='spike';size=52;}
  else if(b.reload<0.3){type='star';size=18;}
  if(type==='puff'){
    spawnPuff(x,y,'#cfcfcf',4,60,5,0.5);
    novaFX(x,y,b.color,22,0.12);
    return;
  }
  topFX.push({kind:'muzzle',type,x,y,angle,color:b.color,size,half,timer:0.1,maxTimer:0.1});
  if(b.reload<0.3) spawnDebris(x,y,'#e8c35a',1,70,1.5,2.5,0.5);
  if(b.pellets>=4) spawnDebris(x,y,'#c0392b',1,80,2,3,0.6);
}
// jagged cracks that stay on the ground for a moment
function crackFX(x,y,radius,count){
  const lines=[], base=Math.random()*TAU;
  for(let i=0;i<count;i++){
    let a=base+i/count*TAU+rand(-0.18,0.18);
    const pts=[{x:x+Math.cos(a)*radius*0.12,y:y+Math.sin(a)*radius*0.12}];
    const steps=4+(Math.random()*2|0);
    for(let st=1;st<=steps;st++){
      a+=rand(-0.28,0.28);
      const d=radius*(0.12+0.88*st/steps);
      pts.push({x:x+Math.cos(a)*d,y:y+Math.sin(a)*d});
    }
    lines.push(pts);
  }
  groundEffects.push({x,y,timer:1.5,maxTimer:1.5,crack:true,lines});
}
function drawRocketShape(color){
  // rocket facing +x, with flame
  withGlow('#ff9b3a',12,()=>{ ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(-13-Math.random()*4,-2.5); ctx.lineTo(-13-Math.random()*4,2.5); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.rect(-6,-3.4,13,6.8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#e8e8e8';
  ctx.beginPath(); ctx.moveTo(7,-3.4); ctx.lineTo(13,0); ctx.lineTo(7,3.4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#b8860b';
  ctx.beginPath(); ctx.moveTo(-6,-3.4); ctx.lineTo(-9,-6.5); ctx.lineTo(-2,-3.4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6,3.4); ctx.lineTo(-9,6.5); ctx.lineTo(-2,3.4); ctx.closePath(); ctx.fill();
}
function spawnRocketRain(e,cx,cy,pm){
  for(let i=0;i<6;i++){
    const a=Math.random()*TAU, r=Math.sqrt(Math.random())*110;
    const t=0.55+i*0.14;
    strikes.push({x:Math.max(30,Math.min(W-30,cx+Math.cos(a)*r)),y:Math.max(30,Math.min(H-30,cy+Math.sin(a)*r)),t,owner:e,team:e.team,dmg:1200*pm,splash:85,color:e.brawlerData.color});
  }
}
function spawnBombs(e,x,y,pm){
  const base=Math.random()*TAU;
  for(let i=0;i<4;i++){
    const a=base+i/4*TAU;
    strikes.push({kind:'bomb',x:x+Math.cos(a)*36,y:y+Math.sin(a)*36,t:0.9+i*0.06,owner:e,team:e.team,dmg:1600*pm,splash:75,color:e.brawlerData.color});
  }
}
function updateStrikes(dt){
  for(let i=strikes.length-1;i>=0;i--){
    const st=strikes[i]; st.t-=dt;
    if(st.t<=0){
      strikes.splice(i,1);
      explode({x:st.x,y:st.y,color:st.color,splash:st.splash,dmg:st.dmg,owner:st.owner,team:st.team,hit:new Set(),lingering:false,slow:false,splitCount:0,splitGen:0});
    }
  }
}
function drawStrikes(){
  for(const st of strikes){
    const enemy=player && st.owner!==player && (st.team===null||st.team!==player.team);
    ctx.save();
    ctx.globalAlpha=0.55+Math.sin(performance.now()/70)*0.15;
    ctx.lineWidth=2; ctx.strokeStyle=enemy?'#ff5a5a':'#ffe38a'; ctx.fillStyle=enemy?'rgba(255,90,90,.12)':'rgba(255,227,138,.1)';
    ctx.beginPath(); ctx.arc(st.x,st.y,st.splash,0,TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
    if(st.kind==='bomb'){
      ctx.beginPath(); ctx.ellipse(st.x,st.y+6,8,3.5,0,0,TAU); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
      const blink=st.t<0.4 && Math.floor(performance.now()/70)%2===0;
      ctx.beginPath(); ctx.arc(st.x,st.y,7.5,0,TAU); ctx.fillStyle=blink?'#ffffff':'#2b2f3a'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#14110f'; ctx.stroke();
      ctx.beginPath(); ctx.arc(st.x-2.5,st.y-2.5,2,0,TAU); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill();
      ctx.strokeStyle='#c9a24a'; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(st.x+3,st.y-6); ctx.quadraticCurveTo(st.x+8,st.y-10,st.x+6,st.y-14); ctx.stroke();
      withGlow('#ffb347',10,()=>{ ctx.fillStyle=Math.random()<0.5?'#fff2a8':'#ff9b3a'; ctx.beginPath(); ctx.arc(st.x+6,st.y-14,2+Math.random()*1.5,0,TAU); ctx.fill(); });
    } else if(st.t<0.35){
      const h=st.t/0.35*280;
      ctx.beginPath(); ctx.ellipse(st.x,st.y,7,3.5,0,0,TAU); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
      ctx.save(); ctx.translate(st.x,st.y-h); ctx.rotate(Math.PI/2); drawRocketShape(st.color); ctx.restore();
    }
  }
}
function summonTurret(owner){
  for(const m of entities){ if(m.isMinion && m.owner===owner) m.alive=false; }
  if(owner.team===null) owner.team='S'+owner.id;
  const ang=owner.angle;
  const t=createEntity(TURRET,true,owner.team,owner.x+Math.cos(ang)*50,owner.y+Math.sin(ang)*50,'Scrappy');
  t.isMinion=true; t.owner=owner; t.lifeTimer=14; t.angle=ang;
  resolveObstacles(t); clampToArena(t);
  entities.push(t);
  novaFX(t.x,t.y,'#3498db',60,0.25);
  ringFX(t.x,t.y,'#74b9ff',50,3);
  spawnPuff(t.x,t.y,'#9aa0a8',6,120,10,0.7);
  spawnDebris(t.x,t.y,'#7f8c8d',5,120,2.5,5,0.8);
}
function summonBear(owner){
  for(const m of entities){ if(m.isMinion && m.owner===owner) m.alive=false; }
  // in free-for-all the owner and the bear share a private team so they never hurt each other
  if(owner.team===null) owner.team='S'+owner.id;
  const ang=owner.angle;
  const bear=createEntity(BEAR,true,owner.team,owner.x+Math.cos(ang)*50,owner.y+Math.sin(ang)*50,'Bear');
  bear.isMinion=true; bear.owner=owner; bear.lifeTimer=20;
  bear.angle=ang;
  resolveObstacles(bear); clampToArena(bear);
  entities.push(bear);
  novaFX(bear.x,bear.y,'#e67e22',70,0.25);
  ringFX(bear.x,bear.y,'#e67e22',60,3);
  spawnPuff(bear.x,bear.y,'#9aa0a8',10,160,14,0.9);
  spawnDebris(bear.x,bear.y,'#6e5b45',6,140,3,6,0.8);
  triggerShake(4,0.15);
}
function updateDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.z+=d.vz*dt; d.vz-=900*dt;
    if(d.z<0){
      d.z=0;
      if(!d.bounced){ d.vz=-d.vz*0.35; d.bounced=true; } else d.vz=0;
      d.vx*=0.6; d.vy*=0.6; d.vr*=0.8;
    }
    d.rot+=d.vr*dt; d.life-=dt;
    if(d.life<=0) debris.splice(i,1);
  }
}
function updateTopFX(dt){
  for(let i=topFX.length-1;i>=0;i--){
    topFX[i].timer-=dt;
    if(topFX[i].timer<=0) topFX.splice(i,1);
  }
}

function createEntity(bi,isBot,team,x,y,name){
  const b=(typeof bi==='object')?bi:BRAWLERS[bi];
  return {id:idCounter++, brawlerIndex:bi, brawlerData:b, name:name||b.name, isBot, team,
    x,y, angle:0, hp:b.hp, maxHp:b.hp, baseMaxHp:b.hp, ammo:b.ammoMax, shotCooldown:0, ammoRegenTimer:b.reload*1.3+0.3,
    superCharge:0, superMax:100, alive:true, deathTimer:0, gems:0, kills:0, flashTimer:0,
    shield:false, shieldTimer:0, boostSpeed:false, boostFireRate:false, boostTimer:0, healOnHit:0,
    dashing:false, dashVX:0, dashVY:0, dashTimer:0, dashHit:null, pierceNext:false,
    invisible:false, invisibleTimer:0, slowMul:1, slowTimer:0, timeSinceShot:3, inBush:false,
    cubes:0, cubeDmgMult:1, cubeSuperMult:1, hurtEnv:0, envAcc:0, poisonTimer:0, poisonDps:0, burstQueue:[],
    radius:b.radius, aiState:{}};
}

//////////////////////// INIT GAME ////////////////////////
function getSpawnPoint(e){
  if(mode==='showdown'){
    const ang=Math.random()*Math.PI*2, R=rand(480,680);
    return {x:CX+Math.cos(ang)*R, y:CY+Math.sin(ang)*R};
  }
  const x = e.team==='A' ? 90 : W-90;
  return {x, y: rand(H*0.14,H*0.86)};
}

function initGame(m, bIndex){
  mode=m;
  returnTimer=null; matchEnded=false; playerPlace=0; hitStop=0; hurtFlash=0; superFlash=0; killFeed=[]; camSnap=true; entities=[]; projectiles=[]; groundGems=[]; groundEffects=[]; particles=[]; floatingTexts=[]; debris=[]; topFX=[]; strikes=[];
  teamScore={A:0,B:0}; roundWins={A:0,B:0}; round=1; roundBanner={text:'',timer:0};
  gemCountdown=null; gemSpawnTimer=0; hotzoneProgress={A:0,B:0}; matchTimer=0;
  ball=null; gemMine=null; zone=null;
  crates=[]; powerCubes=[];

  if(mode==='showdown'){
    W=2600; H=1650; CX=1300; CY=825;
    activePillars = pillarsFFA;
    activeBushes = bushesFFA;
    activePoison = [];
    crates = crateSpots.map(p=>({x:p.x,y:p.y,hp:30,maxHp:30,alive:true,respawnTimer:0,radius:24}));
  } else {
    W=1600; H=1020; CX=800; CY=510;
    activePillars = (mode==='gemgrab'||mode==='hotzone'||mode==='brawlball') ? pillarsTeamOpenCenter : pillarsTeam;
    activeBushes = bushesTeam;
    activePoison = [];
  }
  worldVignette=null; decor=null;
  if(mode==='showdown') showdownSafe={radius:850,timer:0,startR:850,endR:115,total:100};
  else showdownSafe={radius:800,timer:0,startR:800,endR:150,total:100};

  if(mode==='showdown'){
    for(let i=0;i<10;i++){
      const ang=i/10*Math.PI*2, R=660;
      const x=CX+Math.cos(ang)*R, y=CY+Math.sin(ang)*R;
      const bi = i===0?bIndex:randomBrawler();
      entities.push(createEntity(bi, i!==0, null, x,y, i===0?'You':BRAWLERS[bi].name));
    }
  } else {
    const aY=[H*0.2,H*0.5,H*0.8], bY=[H*0.2,H*0.5,H*0.8];
    for(let i=0;i<3;i++){
      const bi = i===0?bIndex:randomBrawler();
      entities.push(createEntity(bi, i!==0, 'A', 90, aY[i], i===0?'You':BRAWLERS[bi].name));
    }
    for(let i=0;i<3;i++){
      const bi=randomBrawler();
      entities.push(createEntity(bi, true, 'B', W-90, bY[i], BRAWLERS[bi].name));
    }
    if(mode==='gemgrab'){ gemMine={x:CX,y:CY}; }
    if(mode==='hotzone'){ zone={x:CX,y:CY,r:140}; }
    if(mode==='brawlball'){ ball={x:CX,y:CY,vx:0,vy:0,radius:11}; }
  }
  player=entities[0];
  gameState='playing';
  lastTime=performance.now();
  requestAnimationFrame(loop);
}

//////////////////////// COMBAT ////////////////////////
function spawnProjectile(owner,angle,dmg,range,speed,opts){
  opts=opts||{};
  const ox = opts.originX!=null ? opts.originX : owner.x;
  const oy = opts.originY!=null ? opts.originY : owner.y;
  const b=owner.brawlerData;
  let style='bolt';
  if(b.name==='Poco'||b.name==='Nita') style='wave';
  else if(b.name==='Bear') style='punch';
  else if(b.name==='Grom') style='ball';
  else if(b.name==='Rico') style='ricochet';
  else if(b.name==='Jessie') style='spark';
  else if(b.name==='Spike') style=opts.spikeNeedle?'needle':'cactus';
  else if(opts.pierce) style='beam';
  else if(opts.bounces) style='star';
  else if(opts.slow) style='frost';
  else if(b.name==='Leon') style='spinblade';
  else if(b.name==='Vesper') style='blade';
  else if(b.name==='Brock') style='rocket';
  else if(b.name==='Crow') style='blade';
  else if(b.name==='Colt') style='slug';
  else if(b.pellets>=4) style='shot';
  else if(b.pellets>=2) style='spread';
  else if(b.range>=450) style='beam';
  projectiles.push({x:ox,y:oy,vx:Math.cos(angle)*speed*60*(opts.accel?0.7:1),vy:Math.sin(angle)*speed*60*(opts.accel?0.7:1),
    dmg,range,traveled:0,owner,team:owner.team,pierce:!!opts.pierce,aoe:!!opts.aoe,splash:opts.splash||0,
    color:owner.brawlerData.color,hit:new Set(),arc:!!opts.arc,style,
    bouncesLeft:opts.bounces||0, lingering:!!opts.lingering, dotDmg:opts.dotDmg||0, dotDuration:opts.dotDuration||0,
    slow:!!opts.slow, splitCount:opts.splitCount||0, splitGen:opts.splitGen||0,
    poisonDps:opts.poisonDps||0, poisonDuration:opts.poisonDuration||0,
    spikes:opts.spikes||0, hitR:opts.hitR||5, hitR0:opts.hitR||5, hitGrow:opts.hitGrow||0, sector:opts.sector||0, ox:ox, oy:oy, ang:angle, accel:opts.accel||0, baseSpeed:speed*60, heals:opts.heals||0, knock:opts.knock||0, noTB:!!opts.noTargetBounce, chain:!!opts.chain,
    distScale:!!opts.distMax, distMin:opts.distMin||1, distMax:opts.distMax||1,
    trail:[], trailMax:(style==='beam'?14:(style==='tracer'?9:7))});
}
// fires a ring of Crow's normal shots outward in every direction from (x,y)
function kestrelCircleBurst(e,x,y,pm){
  const b=e.brawlerData;
  const COUNT=14;
  for(let i=0;i<COUNT;i++){
    const a=(Math.PI*2*i/COUNT);
    spawnProjectile(e,a,b.dmg*pm,b.range,b.projSpeed,{originX:x,originY:y,
      poisonDps:b.poisonDps?b.poisonDps*pm:0, poisonDuration:b.poisonDuration||0});
  }
}
function tryFire(e,angle,targetDist){
  const b=e.brawlerData;
  if(e.ammo<=0||e.shotCooldown>0) return;
  e.timeSinceShot=0;
  e.ammo--; e.shotCooldown=b.reload*(e.boostFireRate?0.5:1); e.ammoRegenTimer=b.reload*1.3+0.3;
  if(b.quake){ triggerEarthquake(e,b); return; }
  e.recoil=0.1;
  const muzX=e.x+Math.cos(angle)*(e.radius+4), muzY=e.y+Math.sin(angle)*(e.radius+4);
  muzzleFX(e,b,angle,muzX,muzY);
  if(b.range<=130){
    groundEffects.push({x:e.x,y:e.y,angle,timer:0.16,maxTimer:0.16,color:b.color,swipe:true,radius:e.radius+28});
  }
  if(b.burst){
    const inaccB = e.isBot?4:1.2;
    for(let i=0;i<b.burst;i++){
      e.burstQueue.push({t:i*b.burstDelay,angle:angle+deg2rad((Math.random()-0.5)*inaccB*2),range:b.range,speed:b.projSpeed,dmg:b.dmg*(e.cubeDmgMult||1),noFlash:i===0,opts:b.bounces?{bounces:b.bounces,noTargetBounce:true}:null});
    }
    return;
  }
  if(b.stagger){
    // blades leave one after another, sweeping from the thrower's left to right
    const inaccS = e.isBot?6:2;
    for(let i=0;i<b.pellets;i++){
      const off = -b.spread/2 + b.spread*i/(b.pellets-1);
      e.burstQueue.push({t:i*b.stagger,angle:angle+deg2rad(off)+deg2rad((Math.random()-0.5)*inaccS),range:b.range,speed:b.projSpeed,dmg:b.dmg*(e.cubeDmgMult||1)*(e.invisible?1.25:1),noFlash:i===0});
    }
    return;
  }
  const effRange = (b.arc && targetDist!=null) ? Math.max(60,Math.min(b.range,targetDist)) : b.range;
  for(let i=0;i<b.pellets;i++){
    const off = b.pellets===1?0:(-b.spread/2 + b.spread*i/(b.pellets-1));
    const inacc = e.isBot?6:2;
    const ang = angle + deg2rad(off) + deg2rad((Math.random()-0.5)*inacc*2);
    let dmg=b.dmg*(e.cubeDmgMult||1), pierce=!!b.pierceShot;
    if(e.pierceNext){ dmg*=2; pierce=true; }
    spawnProjectile(e,ang,dmg,effRange,b.projSpeed*(b.pellets>=4?(1+rand(-0.08,0.08)):1),{aoe:b.aoe,splash:b.splash,pierce,arc:b.arc,
      bounces:b.bounces,lingering:b.lingering,dotDmg:b.dotDmg,dotDuration:b.dotDuration,slow:b.slow,splitCount:b.splitCount,splitGen:b.splitGen,
      poisonDps:b.poisonDps?b.poisonDps*(e.cubeDmgMult||1):0, poisonDuration:b.poisonDuration||0,
      distMin:b.distMin, distMax:b.distMax, hitR:b.hitR, hitGrow:b.hitGrow, accel:b.accel, sector:b.cone?deg2rad(b.cone/2):0, heals:b.heals, spikes:b.spikes, chain:b.chain});
  }
  if(e.pierceNext) e.pierceNext=false;
}
function triggerEarthquake(e,b){
  const dmg=b.dmg*(e.cubeDmgMult||1)*(e.hexedTimer>0?(e.hexDmgMult||0.7):1);
  const radius=b.splash;
  e.slamTimer=0.22;
  novaFX(e.x,e.y,'#ffe9b8',radius*0.7,0.2);

function applyDamage(target,dmg,source){

  target.hp-=reduced;
  target.timeSinceShot=0;
  target.flashTimer=0.1;
  if(player && (target===player||source===player) && reduced>=target.maxHp*0.2) hitStop=Math.max(hitStop,0.06);
  if(target===player) hurtFlash=0.3;
  spawnFloatText(target.x,target.y-target.radius-6, '-'+Math.round(reduced), '#ff6b6b', Math.min(26,13+Math.sqrt(reduced)/6));
  if(target.hp<=0) handleDeath(target,source);
}
function applyTickDamage(target,dmg,source,color){

  target.envAcc=(target.envAcc||0)+dmg;

  spawnParticles(target.x,target.y,target.brawlerData.color,22,180);

    collectCube(killer);

  if(p.distScale) hitDmg=p.dmg*(p.distMin+(p.distMax-p.distMin)*Math.min(1,p.traveled/p.range));
  applyDamage(target,hitDmg,p.owner);
  knockback(target, Math.atan2(p.vy,p.vx), p.knock||Math.min(14,hitDmg*0.35));
  spawnParticles(target.x,target.y,p.color,7,140);
  if(p.slow) applySlow(target);
  p.owner.superCharge=Math.min(p.owner.superMax,p.owner.superCharge+hitDmg/60*(p.owner.cubeSuperMult||1));
  if(p.owner.healOnHit){
    const heal=hitDmg*p.owner.healOnHit;
    p.owner.hp=Math.min(p.owner.maxHp,p.owner.hp+heal);
    spawnFloatText(p.owner.x,p.owner.y-p.owner.radius-20,'+'+Math.round(heal),'#7CFC9A');

  if(p.poisonDps>0){

    spawnFloatText(target.x,target.y-target.radius-20,'POISONED','#b266ff');

//////////////////////// MOVEMENT ////////////////////////
function resolveObstacles(e){
  for(const r of activePillars){
    const cx=Math.max(r.x,Math.min(e.x,r.x+r.w)), cy=Math.max(r.y,Math.min(e.y,r.y+r.h));
    const dx=e.x-cx, dy=e.y-cy, d=Math.hypot(dx,dy);
    if(d<e.radius){
      if(d>0.001){ const push=(e.radius-d); e.x+=dx/d*push; e.y+=dy/d*push; }
      else e.x+=e.radius;
    }
  }
  for(const c of crates){
    if(!c.alive) continue;
    const dx=e.x-c.x, dy=e.y-c.y, d=Math.hypot(dx,dy), minD=e.radius+c.radius;
    if(d<minD){
      if(d>0.001){ const push=(minD-d); e.x+=dx/d*push; e.y+=dy/d*push; }
      else e.x+=minD;
    }
  }
}
function clampToArena(e){
  e.x=Math.max(10+e.radius,Math.min(W-10-e.radius,e.x));
  e.y=Math.max(10+e.radius,Math.min(H-10-e.radius,e.y));
}
function movePlayerLike(e,mx,my,dt){
  const speed=e.brawlerData.speed*(e.boostSpeed?1.4:1)*(e.slowTimer>0?e.slowMul:1);
  if(mx||my){
    const len=Math.hypot(mx,my)||1;
    e.x+=mx/len*speed*dt*60; e.y+=my/len*speed*dt*60;
  }
  resolveObstacles(e); clampToArena(e);
}
function isInBush(e){
  for(const r of activeBushes){ if(pointInRect(e.x,e.y,r)) return true; }
  return false;
}
function canSense(observer,target){
  if(target===observer) return true;
  if(target.invisible) return dist(observer,target) < 150;
  if(target.inBush) return dist(observer,target) < 120;
  return true;
}

//////////////////////// AI ////////////////////////
function getObjectivePoint(e){
  if(mode==='gemgrab'){
    let nearest=null,md=Infinity;
    for(const g of groundGems){ const d=dist(e,g); if(d<md){md=d;nearest=g;} }
    return nearest || gemMine;
  }
  if(mode==='hotzone') return zone;
  if(mode==='brawlball') return ball;
  if(mode==='showdown'){
    let nearestCube=null,ncd=Infinity;
    for(const c of powerCubes){ if(!stormInside(c,-150)) continue; const d=dist(e,c); if(d<ncd){ncd=d;nearestCube=c;} }
    if(nearestCube && ncd<600) return nearestCube;
    return null;
  }
  return null;
}
function hazardDestination(e){
  if(stormActive()){
    // keep a comfortable buffer from the storm edge, with hysteresis so bots don't jitter back and forth along it
    const size = Math.min(stormZone().hw, stormZone().hh);
    const enter=Math.min(110,size*0.35), exit=Math.min(210,size*0.65);
    const need = e.aiState.stormRetreat ? exit : enter;
    if(!stormInside(e,-need)){ e.aiState.stormRetreat=true; return {x:CX,y:CY}; }
    e.aiState.stormRetreat=false;
  }
  for(const z of activePoison){
    if(dist(e,z)<z.r+6){
      let ax=e.x-z.x, ay=e.y-z.y, l=Math.hypot(ax,ay);
      if(l<1){ ax=1; ay=0; l=1; }
      return {x:z.x+ax/l*(z.r+70), y:z.y+ay/l*(z.r+70)};
    }
  }
  return null;
}
function avoidGas(e,mx,my){
  const len=Math.hypot(mx,my);
  if(len<0.001) return [mx,my];
  let dx=mx/len, dy=my/len;
  for(const z of activePoison){
    const d=dist(e,z), rim=z.r+70;
    if(d<rim && d>0.01){
      const ax=(e.x-z.x)/d, ay=(e.y-z.y)/d;
      const toward=-(dx*ax+dy*ay);
      if(toward>0){
        let tx=-ay, ty=ax;
        if(tx*dx+ty*dy<0){ tx=-tx; ty=-ty; }
        const k=Math.min(1,(rim-d)/70)*1.6*toward;
        dx+=(ax*0.7+tx*1.2)*k; dy+=(ay*0.7+ty*1.2)*k;
      }
    }
  }
  return [dx,dy];
}
function hazardEscape(e,dt,dest){
  let target=null,minD=Infinity;
  for(const o of entities){
    if(o!==e && o.alive && (e.team===null || o.team!==e.team) && canSense(e,o)){
      const d=dist(e,o); if(d<minD){minD=d;target=o;}
    }
  }
  const a=Math.atan2(dest.y-e.y,dest.x-e.x);
  e.angle=a;
  let wantFire=false;
  if(target && minD<e.brawlerData.range){ e.angle=Math.atan2(target.y-e.y,target.x-e.x); wantFire=true; }
  movePlayerLike(e,Math.cos(a),Math.sin(a),dt);
  if(wantFire) tryFire(e,e.angle,minD);
}
function fleeAndMaybeFire(e,dt){
  let target=null,minD=Infinity;
  for(const o of entities){
    if(o!==e && o.alive && (e.team===null || o.team!==e.team) && canSense(e,o)){
      const d=dist(e,o); if(d<minD){minD=d;target=o;}
    }
  }
  let moveX=0,moveY=0, wantFire=false;
  if(target && minD<460){
    const enemyAngle=Math.atan2(target.y-e.y,target.x-e.x);
    const flee=enemyAngle+Math.PI;
    moveX=Math.cos(flee); moveY=Math.sin(flee);
    e.angle=enemyAngle;
    wantFire = e.ammo>0 && minD<e.brawlerData.range;
  } else {
    const rp = e.team==='A'? {x:90,y:e.y} : e.team==='B'? {x:W-90,y:e.y} : {x:CX,y:CY};
    const a=Math.atan2(rp.y-e.y, rp.x-e.x); e.angle=a;
    if(dist(e,rp)>60){ moveX=Math.cos(a); moveY=Math.sin(a); }
  }
  [moveX,moveY]=avoidGas(e,moveX,moveY);
  movePlayerLike(e,moveX,moveY,dt);
  if(wantFire) tryFire(e,e.angle,minD);
  if(e.superCharge>=e.superMax){ triggerSuper(e); e.superCharge=0; }
}
function minionControl(e,dt){
  // the bear charges the closest enemy, and stays near its owner when nobody is around
  let target=null,nd=Infinity;
  for(const o of entities){
    if(o===e||!o.alive||o===e.owner||o.team===e.team) continue;
    const d=dist(e,o); if(d<nd){nd=d;target=o;}
  }
  if(!target){
    const ow=e.owner;
    if(ow && ow.alive && dist(e,ow)>90){
      const a=Math.atan2(ow.y-e.y,ow.x-e.x); e.angle=a;
      movePlayerLike(e,Math.cos(a),Math.sin(a),dt);
    }
    return;
  }
  const a=Math.atan2(target.y-e.y,target.x-e.x); e.angle=a;
  if(nd>e.radius+target.radius+10) movePlayerLike(e,Math.cos(a),Math.sin(a),dt);
  if(nd<e.brawlerData.range+target.radius) tryFire(e,a,nd);
}
function aiControl(e,dt){
  if(e.isMinion){ minionControl(e,dt); return; }
  const hz=hazardDestination(e);
  if(hz){ hazardEscape(e,dt,hz); return; }
  const protectingGems = mode==='gemgrab' && gemCountdown!==null && e.gems>0;
  const critical = e.hp/e.maxHp < 0.3;
  if(protectingGems || critical){ fleeAndMaybeFire(e,dt); return; }
  let target=null,minD=Infinity,bestScore=Infinity;
  for(const o of entities){
    if(o!==e && o.alive && (e.team===null || o.team!==e.team) && canSense(e,o)){
      const d=dist(e,o);
      const score = d - (o.hp<o.maxHp*0.3 ? 150:0);
      if(score<bestScore){ bestScore=score; target=o; minD=d; }
    }
  }
  let moveX=0,moveY=0, wantFire=false;
  const range=e.brawlerData.range;
  if(target && minD<range*1.3){
    const aimAngle=Math.atan2(target.y-e.y,target.x-e.x);
    e.angle=aimAngle;
    const desired=range*0.65;
    if(minD>desired+20){ moveX=Math.cos(aimAngle); moveY=Math.sin(aimAngle); }
    else if(minD<desired-20){ moveX=-Math.cos(aimAngle); moveY=-Math.sin(aimAngle); }
    else {
      if(!e.aiState.strafeTimer||e.aiState.strafeTimer<=0){ e.aiState.strafeDir=(e.aiState.strafeDir||1)*-1; e.aiState.strafeTimer=1.5+Math.random(); }
      e.aiState.strafeTimer-=dt;
      const perp=aimAngle+Math.PI/2*e.aiState.strafeDir;
      moveX=Math.cos(perp)*0.6; moveY=Math.sin(perp)*0.6;
    }
    wantFire = minD<range;
  } else {
    const obj=getObjectivePoint(e);
    if(obj){
      const a=Math.atan2(obj.y-e.y,obj.x-e.x); e.angle=a;
      if(dist(e,obj)>15){ moveX=Math.cos(a); moveY=Math.sin(a); }
    } else {
      if(!e.aiState.wanderTimer||e.aiState.wanderTimer<=0){ e.aiState.wanderAngle=Math.random()*Math.PI*2; e.aiState.wanderTimer=2+Math.random()*2; }
      e.aiState.wanderTimer-=dt;
      moveX=Math.cos(e.aiState.wanderAngle); moveY=Math.sin(e.aiState.wanderAngle);
      e.angle=e.aiState.wanderAngle;
    }
  }
  [moveX,moveY]=avoidGas(e,moveX,moveY);
  movePlayerLike(e,moveX,moveY,dt);
  if(wantFire) tryFire(e,e.angle,minD);
  if(e.superCharge>=e.superMax && Math.random()<0.03){ triggerSuper(e); e.superCharge=0; }
}
function handlePlayerControl(e,dt){
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  movePlayerLike(e,mx,my,dt);
  e.angle=Math.atan2((mouse.y+camera.y)-e.y,(mouse.x+camera.x)-e.x);
  if(mouse.down) tryFire(e,e.angle, dist(e,{x:mouse.x+camera.x,y:mouse.y+camera.y}));
  if(keys[' ']){
    if(e.superCharge>=e.superMax){ triggerSuper(e); e.superCharge=0; }
    keys[' ']=false;
  }
}

//////////////////////// UPDATE ////////////////////////
function hasLOS(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0), n=Math.max(1,Math.ceil(d/12));
  for(let i=1;i<n;i++){
    const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n;
    for(const r of activePillars){ if(pointInRect(x,y,r)) return false; }
  }
  return true;
}
function hitTest(p,t){
  if(p.sector){
    const dx=t.x-p.ox, dy=t.y-p.oy, d=Math.hypot(dx,dy);
    if(d>p.traveled+t.radius) return false;
    if(d>1){
      let da=Math.abs(Math.atan2(dy,dx)-p.ang);
      if(da>Math.PI) da=2*Math.PI-da;
      if(da>p.sector+Math.asin(Math.min(1,t.radius/d))) return false;
    }
    return hasLOS(p.ox,p.oy,t.x,t.y);
  }
  return dist(p,t)<t.radius+(p.hitR||5);
}
function updateProjectiles(dt){
  for(let idx=projectiles.length-1;idx>=0;idx--){
    const p=projectiles[idx];
    p.px=p.x; p.py=p.y;
    if(!p.arc){
      p.trail.push({x:p.x,y:p.y});
      if(p.trail.length>p.trailMax) p.trail.shift();
      if(p.style==='wave' && p.owner.brawlerData.name==='Poco' && Math.random()<0.3) { const aa=p.ang+rand(-p.sector,p.sector); spawnFloatText(p.ox+Math.cos(aa)*p.traveled,p.oy+Math.sin(aa)*p.traveled,'♪','#e0b3ff',16); }
      if(p.style==='wave' && p.owner.brawlerData.name==='Nita' && Math.random()<0.5) spawnPuff(p.x,p.y,'#b39b78',1,20,5,0.4);
      if(p.style==='rocket' && Math.random()<0.5) spawnPuff(p.x,p.y,'#cfcfcf',1,15,4,0.5);
      if(p.style==='blade' && p.owner.brawlerData.name==='Crow' && Math.random()<0.35) spawnParticles(p.x,p.y,'#9be83a',1,28);
    }
    const totalStep=Math.hypot(p.vx,p.vy)*dt;
    const subSteps=Math.max(1,Math.min(8,Math.ceil(totalStep/15)));
    const sdt=dt/subSteps;
    let dead=false;
    for(let s=0;s<subSteps && !dead;s++){
      if(p.accel){ const sp0=Math.hypot(p.vx,p.vy); if(sp0<p.baseSpeed*1.7){ const kk=1+p.accel*sdt; p.vx*=kk; p.vy*=kk; } }
      if(p.hitGrow) p.hitR=p.hitR0+p.hitGrow*Math.min(1,p.traveled/p.range);
      const stepLen=Math.hypot(p.vx,p.vy)*sdt;
      p.x+=p.vx*sdt; p.y+=p.vy*sdt; p.traveled+=stepLen;
      if(p.arc && Math.random()<0.35){
        spawnParticles(p.x, p.y, 'rgba(200,200,200,0.5)', 1, 15);
      }
      if(!p.arc){
        for(const r of activePillars){
          if(pointInRect(p.x,p.y,r)){
            if(p.bouncesLeft>0 && !p.chain){
              const cx=Math.max(r.x,Math.min(p.px,r.x+r.w)), cy=Math.max(r.y,Math.min(p.py,r.y+r.h));
              const dx=p.px-cx, dy=p.py-cy, d=Math.hypot(dx,dy)||1;
              const nx=dx/d, ny=dy/d;
              const vn=p.vx*nx+p.vy*ny;
              p.vx-=2*vn*nx; p.vy-=2*vn*ny;
              p.x=p.px; p.y=p.py;
              p.bouncesLeft--;
              spawnParticles(p.x,p.y,p.color,5,100);
              sparkFX(p.x,p.y,p.color,9);
            } else {
              dead=true; if(p.aoe) explode(p); else { spawnParticles(p.x,p.y,'#d8d8d8',5,90); sparkFX(p.x,p.y,'#eeeeee',9); spawnDebris(p.x,p.y,'#4a4f58',2,80,1.5,3,0.5); }
            }
            break;
          }
        }
      }
      if(!dead && !p.arc){
        for(const c of crates){
          if(!c.alive) continue;
          if(dist(p,c)<c.radius+5){
            damageCrate(c,p.dmg,p.color);
            dead=true;
            break;
          }
        }
      }
      if(!dead && !p.arc && p.heals){
        for(const t of entities){
          if(t===p.owner||!t.alive||p.hit.has(t.id)) continue;
          if(p.team!==null && t.team===p.team && hitTest(p,t)){
            p.hit.add(t.id);
            const heal=p.dmg*p.heals;
            t.hp=Math.min(t.maxHp,t.hp+heal);
            spawnFloatText(t.x,t.y-t.radius-20,'+'+Math.round(heal),'#7CFC9A');
            spawnParticles(t.x,t.y,'#7CFC9A',8,80);
          }
        }
      }
      if(!dead && !p.arc){
        for(const t of entities){
          if(t===p.owner||!t.alive) continue;
          if(p.team!==null && t.team===p.team) continue;
          if(p.hit.has(t.id)) continue;
          if(hitTest(p,t)){
            p.hit.add(t.id);
            doHit(p,t);
            if(p.aoe){ explode(p); dead=true; }
            else if(p.bouncesLeft>0 && !p.noTB){
              p.bouncesLeft--;
              let newTarget=null,nd=Infinity;
              for(const o2 of entities){
                if(o2!==p.owner && o2.alive && !p.hit.has(o2.id) && (p.team===null||o2.team!==p.team)){
                  const dd=dist(t,o2); if(dd<320 && dd<nd){ nd=dd; newTarget=o2; }
                }
              }
              if(newTarget){
                const spd=Math.hypot(p.vx,p.vy);
                const a2=Math.atan2(newTarget.y-p.y,newTarget.x-p.x);
                p.vx=Math.cos(a2)*spd; p.vy=Math.sin(a2)*spd;
                p.traveled=0;
                if(p.chain){
                  p.dmg*=0.8;
                  topFX.push({kind:'zap',x:p.x,y:p.y,x2:newTarget.x,y2:newTarget.y,color:p.color,timer:0.18,maxTimer:0.18,seed:Math.random()});
                }
                spawnParticles(p.x,p.y,p.color,4,90);
              } else if(!p.pierce){ dead=true; }
            }
            else if(!p.pierce){ dead=true; }
            break;
          }
        }
      }
      if(!dead && p.traveled>=p.range){ if(p.aoe) explode(p); else { spawnParticles(p.x,p.y,p.color,4,50); spawnPuff(p.x,p.y,'#dddddd',1,20,4,0.35); } dead=true; }
      if(!dead && p.bouncesLeft>0 && !p.arc && !p.chain){
        let bounced=false;
        if(p.x<0){ p.x=0; p.vx=Math.abs(p.vx); bounced=true; }
        else if(p.x>W){ p.x=W; p.vx=-Math.abs(p.vx); bounced=true; }
        if(p.y<0){ p.y=0; p.vy=Math.abs(p.vy); bounced=true; }
        else if(p.y>H){ p.y=H; p.vy=-Math.abs(p.vy); bounced=true; }
        if(bounced){ p.bouncesLeft--; sparkFX(p.x,p.y,p.color,9); }
      }
      if(!dead && (p.x<0||p.x>W||p.y<0||p.y>H)) dead=true;
    }
    if(dead) projectiles.splice(idx,1);
  }
}
function updateGroundEffects(dt){
  for(let i=groundEffects.length-1;i>=0;i--){
    const ge=groundEffects[i];
    ge.timer-=dt;
    if(ge.dmg){
      ge.tickTimer-=dt;
      if(ge.tickTimer<=0){
        ge.tickTimer=ge.dmgTick;
        for(const t of entities){
          if(t.alive && t!==ge.owner && (ge.team===null||t.team!==ge.team) && dist(t,ge)<ge.r){
            applyDamage(t,ge.dmg,ge.owner);
            if(ge.slow) applySlow(t);
          }

      }
      if(Math.random()<0.5) spawnParticles(ge.x+rand(-ge.r*0.6,ge.r*0.6), ge.y+rand(-ge.r*0.6,ge.r*0.6), ge.color, 1, 40);
    }
    if(ge.timer<=0) groundEffects.splice(i,1);
  }
}
function inPoison(e){
  for(const z of activePoison){ if(dist(e,z)<z.r) return true; }
  return false;
}
function updatePoisonZones(dt){
  for(const z of activePoison){
    for(const e of entities){
      if(e.alive && dist(e,z)<z.r){

}
function updateParticles(dt){

function updateFloatingTexts(dt){

function collectCube(e){
  const before=e.cubes;
  e.cubes=Math.min(8,e.cubes+1);
  if(e.cubes===before) return;
  const gain=e.baseMaxHp*0.08;
  e.maxHp=e.baseMaxHp*(1+e.cubes*0.08);
  e.hp=Math.min(e.maxHp, e.hp+gain);
  e.cubeDmgMult=1+e.cubes*0.08;
  e.cubeSuperMult=1+e.cubes*0.08;
  spawnFloatText(e.x,e.y-e.radius-24,'+CUBE','#ffe38a');
  spawnParticles(e.x,e.y,'#ffe38a',16,130);

function updateCrates(dt){

  for(let i=powerCubes.length-1;i>=0;i--){

function resetRoundPositions(){
  entities=entities.filter(e=>!e.isMinion);

  for(const e of entities){
    e.alive=true; e.hp=e.maxHp; e.ammo=e.brawlerData.ammoMax; e.shield=false; e.boostSpeed=false; e.boostFireRate=false; e.healOnHit=0; e.pierceNext=false;
    e.invisible=false; e.invisibleTimer=0; e.slowMul=1; e.slowTimer=0; e.timeSinceShot=3;

function endGame(text){
  if(matchEnded) return;
  matchEnded=true;
  gameState='over';
  let result='draw';
  if(/^You Win/.test(text)) result='win';
  else if(/Lose|Wins$|Eliminated/.test(text)) result='lose';
  let delta=0, title=text;
  if(mode==='showdown'){
    const place = result==='win' ? 1 : (playerPlace||10);
    delta=SHOWDOWN_DELTAS[Math.min(SHOWDOWN_DELTAS.length,place)-1];
    title = result==='win' ? 'You Win!' : 'You finished '+ordinal(place);
  } else {
    delta = result==='win' ? 10 : (result==='lose' ? -6 : 0);
    title = result==='win' ? 'Victory!' : (result==='lose' ? 'Defeat' : 'Draw');
  }
  if(result==='win') save.wins++; else if(result==='lose') save.losses++;
  const name=player.brawlerData.name;
  const r=awardTrophies(name,delta);
  document.getElementById('gameoverText').textContent=title;
  const sign=r.delta>=0?'+':'';
  document.getElementById('trophyLine').innerHTML='<span class="ico">'+ICONS.trophy+'</span><span class="'+(r.delta>=0?'pos':'neg')+'">'+sign+r.delta+'</span><span>'+name+' · '+r.after+'</span>';
  let rl;
  if(r.rankAfter>r.rankBefore) rl='<span class="up">RANK UP!</span> '+name+' reached Rank '+r.rankAfter;
  else if(r.rankAfter<r.rankBefore) rl=name+' dropped to Rank '+r.rankAfter;
  else rl=name+' · Rank '+r.rankAfter+' · '+(r.after%250)+' / 250 to the next rank';
  document.getElementById('rankLine').innerHTML=rl;
  document.getElementById('gameover').style.display='flex';
}

// Knockout's storm closes in as a rectangle matching the map's shape; other modes use a circle
function stormActive(){ return mode==='showdown'||mode==='knockout'; }
const STORM_TS=50;
function stormHalfSize(){
  const st=showdownSafe;
  const f=(st.radius-st.endR)/(st.startR-st.endR);
  const endHW=150, endHH=150*H/W;
  return {hw:endHW+(W/2-endHW)*f, hh:endHH+(H/2-endHH)*f};
}
// the safe zone snaps to the fog grid so damage lines up exactly with the squares you see
function stormZone(){
  const z=stormHalfSize(), ts=STORM_TS;
  const sn=v=>(Math.max(0,Math.round(v/ts-0.5))+0.5)*ts;
  return {hw:sn(z.hw),hh:sn(z.hh)};
}
function stormInside(e,margin){
  margin=margin||0;
  const z=stormZone();
  return Math.abs(e.x-CX)<=z.hw+margin && Math.abs(e.y-CY)<=z.hh+margin;
}
function stormUpdate(dt){
  const st=showdownSafe;
  st.timer+=dt;
  st.radius=Math.max(st.endR,st.startR-(st.startR-st.endR)*(st.timer/st.total));
  for(const e of entities){ if(e.alive && !stormInside(e,0)) applyTickDamage(e,e.maxHp*0.2*dt,null,'#8bd62a'); }
}
function showdownUpdate(dt){
  if(player && !player.alive){
    if(returnTimer===null) returnTimer=1.5;
    returnTimer-=dt;
    if(returnTimer<=0){
      endGame('Eliminated');
      return;
    }
  }
  const aliveList=entities.filter(e=>e.alive&&!e.isMinion);
  if(aliveList.length<=1){
    endGame(aliveList.length===1 ? (aliveList[0]===player? 'You Win! 🏆' : aliveList[0].name+' Wins') : 'Draw');
  }
}
function knockoutUpdate(dt){
  if(roundBanner.timer>0){ roundBanner.timer-=dt; return; }
  const aliveA=entities.filter(e=>e.team==='A'&&e.alive&&!e.isMinion).length;
  const aliveB=entities.filter(e=>e.team==='B'&&e.alive&&!e.isMinion).length;
  if(aliveA===0||aliveB===0){
    const winner = aliveA>0?'A':(aliveB>0?'B':null);
    if(winner) roundWins[winner]++;
    if(roundWins.A>=2||roundWins.B>=2){
      endGame(roundWins[player.team]>roundWins[player.team==='A'?'B':'A'] ? 'You Win! 🏆':'You Lose');
    } else {
      round++; roundBanner={text:'Round '+round,timer:2}; resetRoundPositions();
    }
  }
}
function gemGrabUpdate(dt){
  gemSpawnTimer-=dt;
  const heldTotal=entities.reduce((s,e)=>s+(e.alive?e.gems:0),0);
  if(gemSpawnTimer<=0 && (heldTotal+groundGems.length)<10){
    groundGems.push({x:gemMine.x+rand(-30,30), y:gemMine.y+rand(-30,30)});
    gemSpawnTimer=3;
  }
  for(const e of entities){
    if(!e.alive) continue;
    for(let i=groundGems.length-1;i>=0;i--){
      if(dist(e,groundGems[i])<20){ e.gems++; spawnParticles(e.x,e.y,'#f1c40f',6,60); groundGems.splice(i,1); }
    }
  }
  const gemsA=entities.filter(e=>e.team==='A').reduce((s,e)=>s+e.gems,0);
  const gemsB=entities.filter(e=>e.team==='B').reduce((s,e)=>s+e.gems,0);
  teamScore.A=gemsA; teamScore.B=gemsB;
  if(gemsA>=10 || gemsB>=10){
    if(gemCountdown===null) gemCountdown=15;
    gemCountdown-=dt;
    if(gemCountdown<=0){
      const winTeam=gemsA>=10?'A':'B';
      endGame(player.team===winTeam? 'You Win! 🏆':'You Lose');
    }
  } else gemCountdown=null;
  if(matchTimer>150 && gameState==='playing'){
    endGame(gemsA===gemsB?'Draw':(gemsA>gemsB?(player.team==='A'?'You Win! 🏆':'You Lose'):(player.team==='B'?'You Win! 🏆':'You Lose')));
  }
}
function hotZoneUpdate(dt){
  const inA=entities.filter(e=>e.alive&&e.team==='A'&&dist(e,zone)<zone.r).length;
  const inB=entities.filter(e=>e.alive&&e.team==='B'&&dist(e,zone)<zone.r).length;
  const rate=100/45;
  if(inA>0&&inB===0) hotzoneProgress.A=Math.min(100,hotzoneProgress.A+rate*dt);
  else if(inB>0&&inA===0) hotzoneProgress.B=Math.min(100,hotzoneProgress.B+rate*dt);
  if(hotzoneProgress.A>=100) endGame(player.team==='A'?'You Win! 🏆':'You Lose');
  else if(hotzoneProgress.B>=100) endGame(player.team==='B'?'You Win! 🏆':'You Lose');
  else if(matchTimer>110){
    endGame(hotzoneProgress.A===hotzoneProgress.B?'Draw':(hotzoneProgress.A>hotzoneProgress.B?(player.team==='A'?'You Win! 🏆':'You Lose'):(player.team==='B'?'You Win! 🏆':'You Lose')));
  }
}
function resolveBallPillar(){
  for(const r of activePillars){
    const cx=Math.max(r.x,Math.min(ball.x,r.x+r.w)), cy=Math.max(r.y,Math.min(ball.y,r.y+r.h));
    const dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
    if(d<ball.radius){
      const nx = d>0.001? dx/d : 1, ny = d>0.001? dy/d : 0;
      ball.x+=nx*(ball.radius-(d>0.001?d:0)); ball.y+=ny*(ball.radius-(d>0.001?d:0));
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ ball.vx-=(1+0.55)*vn*nx; ball.vy-=(1+0.55)*vn*ny; }
    }
  }
}
function ballCollideWalls(goalHalf){
  const gy0=CY-goalHalf, gy1=CY+goalHalf;
  const inGoalY = ball.y>gy0 && ball.y<gy1;
  if(ball.x<10+ball.radius && !inGoalY){ ball.x=10+ball.radius; ball.vx*=-0.6; }
  if(ball.x>W-10-ball.radius && !inGoalY){ ball.x=W-10-ball.radius; ball.vx*=-0.6; }
  if(ball.y<10+ball.radius){ ball.y=10+ball.radius; ball.vy*=-0.6; }
  if(ball.y>H-10-ball.radius){ ball.y=H-10-ball.radius; ball.vy*=-0.6; }
}
function resetBallAndPositions(){ ball.x=CX;ball.y=CY;ball.vx=0;ball.vy=0; resetRoundPositions(); }
function brawlBallUpdate(dt){
  const goalHalf=110;
  const substeps=Math.max(1,Math.min(8,Math.ceil((Math.hypot(ball.vx,ball.vy)*dt)/15)));
  const sdt=dt/substeps;
  for(let s=0;s<substeps;s++){
    ball.x+=ball.vx*sdt; ball.y+=ball.vy*sdt;
    resolveBallPillar();
    ballCollideWalls(goalHalf);
  }
  ball.vx*=0.98; ball.vy*=0.98;
  const spd=Math.hypot(ball.vx,ball.vy), maxSpd=820;
  if(spd>maxSpd){ ball.vx=ball.vx/spd*maxSpd; ball.vy=ball.vy/spd*maxSpd; }
  for(const e of entities){
    if(!e.alive) continue;
    const d=dist(e,ball);
    if(d<e.radius+ball.radius+2){
      const ang=Math.atan2(ball.y-e.y,ball.x-e.x);
      ball.vx+=Math.cos(ang)*4; ball.vy+=Math.sin(ang)*4;
      const overlap=e.radius+ball.radius+2-d;
      ball.x+=Math.cos(ang)*overlap; ball.y+=Math.sin(ang)*overlap;
    }
  }
  if(ball.x<-5){ teamScore.B++; if(teamScore.B>=2){ endGame(player.team==='B'?'You Win! 🏆':'You Lose'); } else resetBallAndPositions(); }
  else if(ball.x>W+5){ teamScore.A++; if(teamScore.A>=2){ endGame(player.team==='A'?'You Win! 🏆':'You Lose'); } else resetBallAndPositions(); }
  else if(matchTimer>150 && gameState==='playing'){
    endGame(teamScore.A===teamScore.B?'Draw':(teamScore.A>teamScore.B?(player.team==='A'?'You Win! 🏆':'You Lose'):(player.team==='B'?'You Win! 🏆':'You Lose')));
  }
}
function modeUpdate(dt){
  if(stormActive() && !(mode==='knockout' && roundBanner.timer>0)) stormUpdate(dt);
  if(gameState!=='playing') return;
  if(mode==='showdown') showdownUpdate(dt);
  else if(mode==='gemgrab') gemGrabUpdate(dt);
  else if(mode==='knockout') knockoutUpdate(dt);
  else if(mode==='hotzone') hotZoneUpdate(dt);
  else if(mode==='brawlball') brawlBallUpdate(dt);
}

function update(dt){
  matchTimer+=dt;
  if(hurtFlash>0) hurtFlash-=dt;
  if(superFlash>0) superFlash-=dt;
  for(const k of killFeed) k.t-=dt;
  killFeed=killFeed.filter(k=>k.t>0);
  if(shake.timer>0){ shake.timer-=dt; if(shake.timer<=0) shake.mag=0; }
  for(const e of entities){
    if(e.flashTimer>0) e.flashTimer-=dt;
    if(e.slamTimer>0) e.slamTimer-=dt;
    if(e.recoil>0) e.recoil-=dt;
    if(!e.alive){
      if(e.deathFx>0) e.deathFx-=dt;
      if(isFinite(e.deathTimer)){ e.deathTimer-=dt; if(e.deathTimer<=0) respawnEntity(e); }
      continue;
    }
    if(e.shieldTimer>0){ e.shieldTimer-=dt; if(e.shieldTimer<=0) e.shield=false; }
    if(e.boostTimer>0){ e.boostTimer-=dt; if(e.boostTimer<=0){ e.boostSpeed=false; e.boostFireRate=false; e.healOnHit=0; } }
    if(e.invisibleTimer>0){ e.invisibleTimer-=dt; if(e.invisibleTimer<=0){ e.invisible=false; } }
    if(e.slowTimer>0){ e.slowTimer-=dt; if(e.slowTimer<=0){ e.slowMul=1; } }
    if(e.poisonTimer>0){
      applyTickDamage(e,e.poisonDps*dt,null,'#b266ff');
      if(!e.alive) continue;
      e.poisonTimer-=dt;
      if(Math.random()<0.35) spawnParticles(e.x+rand(-e.radius,e.radius), e.y+rand(-e.radius,e.radius), '#b266ff', 1, 35);
      if(e.poisonTimer<=0){ e.poisonTimer=0; e.poisonDps=0; }
    }
    e.inBush=isInBush(e);
    e.timeSinceShot+=dt;
    if(e.hurtEnv>0) e.hurtEnv-=dt;
    if(e.timeSinceShot>=3 && e.hp<e.maxHp && !(e.hurtEnv>0)){
      e.hp=Math.min(e.maxHp, e.hp+e.maxHp*0.05*dt);
      if(Math.random()<0.06) spawnParticles(e.x+rand(-e.radius,e.radius), e.y+rand(-e.radius,e.radius), '#8CFFA0', 1, 20);
    }
    if(e.burstQueue.length){
      for(const q of e.burstQueue) q.t-=dt;
      const due=e.burstQueue.filter(q=>q.t<=0);
      e.burstQueue=e.burstQueue.filter(q=>q.t>0);
      for(const q of due){
        spawnProjectile(e,q.angle,q.dmg,q.range,q.speed,q.opts||{});
        e.recoil=0.08;
        if(!q.noFlash) muzzleFX(e,e.brawlerData,q.angle,e.x+Math.cos(q.angle)*(e.radius+4),e.y+Math.sin(q.angle)*(e.radius+4));
      }
    }
    if(e.shotCooldown>0) e.shotCooldown-=dt;
    if(e.ammo<e.brawlerData.ammoMax){
      e.ammoRegenTimer-=dt;
      if(e.ammoRegenTimer<=0){ e.ammo++; e.ammoRegenTimer=e.brawlerData.reload*1.3+0.3; }
    }
    if(e.dashing){
      e.x+=e.dashVX*dt; e.y+=e.dashVY*dt; e.dashTimer-=dt;
      resolveObstacles(e); clampToArena(e);
      spawnParticles(e.x,e.y,e.brawlerData.color,2,40);
      for(const other of entities){
        if(other!==e && other.alive && (e.team===null||other.team!==e.team) && !e.dashHit.has(other.id) && dist(e,other)<e.radius+other.radius+10){
          if(!e.dashNoDmg) applyDamage(other,1920*(e.cubeDmgMult||1),e);
          e.dashHit.add(other.id);
        }
      }
      if(e.dashTimer<=0){ e.dashing=false; e.dashNoDmg=false; }
      continue;
    }
    if(e===player) handlePlayerControl(e,dt);
    else aiControl(e,dt);
  }
  for(const m of entities){
    if(m.isMinion && m.alive){
      m.lifeTimer-=dt;
      if(m.lifeTimer<=0){ m.alive=false; spawnParticles(m.x,m.y,m.brawlerData.color,12,120); }
    }
  }
  for(let i=entities.length-1;i>=0;i--){ if(entities[i].isMinion && !entities[i].alive) entities.splice(i,1); }
  updateProjectiles(dt);
  updateGroundEffects(dt);
  updatePoisonZones(dt);
  updateParticles(dt);
  updateDebris(dt);
  updateTopFX(dt);
  updateStrikes(dt);
  updateFloatingTexts(dt);
  updateCrates(dt);
  if(gameState==='playing') modeUpdate(dt);
}

const _lightenCache={};
function lightenHex(hex,amt){
  const key=hex+amt;
  if(_lightenCache[key]) return _lightenCache[key];
  let c=hex.replace('#','');
  if(c.length===3) c=c.split('').map(ch=>ch+ch).join('');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), bl=parseInt(c.substr(4,2),16);
  const res=`rgb(${Math.round(r+(255-r)*amt)},${Math.round(g+(255-g)*amt)},${Math.round(bl+(255-bl)*amt)})`;
  _lightenCache[key]=res;
  return res;
}
function drawWeaponShape(b,flashed){

    ctx.fillStyle= flashed? '#ffffff' : '#5a3418'; ctx.fillRect(b.radius+6,3,22,3);
    ctx.fillStyle='#ffe38a'; ctx.beginPath(); ctx.arc(b.radius+4,6,2,0,TAU); ctx.fill();
  } else if(b.name==='Brock'){
    ctx.fillStyle= flashed? '#ffffff' : '#7f8c8d';
    ctx.fillRect(b.radius-6,-4.5,28,9); ctx.strokeRect(b.radius-6,-4.5,28,9);

  } else if(b.name==='Leon'){

    }

      ctx.fillStyle='#6b4423'; ctx.fillRect(b.radius-6,oy-3.5,6,7);
    }
  } else if(b.range<=130){
    ctx.beginPath();
    ctx.moveTo(4,-9); ctx.lineTo(b.radius+15,-3); ctx.lineTo(b.radius+15,3); ctx.lineTo(4,9);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(b.arc){
    ctx.beginPath(); ctx.arc(b.radius+6,0,6,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.radius+6,-6); ctx.lineTo(b.radius+9,-11); ctx.stroke();
    ctx.fillStyle='#ffdd66'; ctx.beginPath(); ctx.arc(b.radius+9,-11,1.6,0,Math.PI*2); ctx.fill();
  } else if(b.pellets>=4){
    ctx.fillRect(b.radius-2,-5,16,4); ctx.strokeRect(b.radius-2,-5,16,4);
    ctx.fillRect(b.radius-2,1,16,4); ctx.strokeRect(b.radius-2,1,16,4);
  } else if(b.pellets>=2){
    ctx.fillRect(b.radius-2,-4,18,3); ctx.strokeRect(b.radius-2,-4,18,3);
    ctx.fillRect(b.radius-2,1,18,3); ctx.strokeRect(b.radius-2,1,18,3);
  } else if(b.range>=450){
    ctx.fillRect(b.radius-2,-1.5,36,3); ctx.strokeRect(b.radius-2,-1.5,36,3);
  } else {
    ctx.fillRect(b.radius-2,-2.5,20,5); ctx.strokeRect(b.radius-2,-2.5,20,5);
  }
}
function rrPath(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function relationColor(e){
  if(e===player) return '#3da5ff';

function outlineText(text,x,y,fill,lw){

  ctx.fillStyle=fill; ctx.fillText(text,x,y);
}
// cartoon face + a little costume per brawler, drawn facing +x
function drawHead(e,flashed){
  const r=e.radius, b=e.brawlerData, name=b.name, col=b.color;
  const dark='#14110f';
  const blob=(x,y,rx,ry,fill,rot)=>{ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=2.2; ctx.strokeStyle=dark; ctx.stroke(); };
  // things that sit behind the head
  if(!flashed){
    switch(name){
      case 'Shelly': blob(-r*0.55,0,r*0.95,r*1.0,'#b13fc4'); break;
      case 'Leon': blob(-r*0.35,0,r*1.05,r*1.1,'#2f6f2a'); break;
      case 'Crow': blob(-r*0.4,0,r*1.0,r*1.1,'#2d1b4e'); break;
      case 'Jessie': blob(-r*0.2,-r*1.0,r*0.5,r*0.5,'#e67e22'); blob(-r*0.2,r*1.0,r*0.5,r*0.5,'#e67e22'); break;
      case 'Nita':

    }

  ctx.beginPath(); ctx.arc(0,0,r,0,TAU);

    grad.addColorStop(0,lightenHex(col,0.55)); grad.addColorStop(1,col);
    ctx.fillStyle=grad;
  }
  ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=dark; ctx.stroke();
  if(flashed) return;

  switch(name){
    case 'Colt': blob(-r*0.35,0,r*0.8,r*1.2,'#8a5a2b'); blob(-r*0.4,0,r*0.42,r*0.42,'#a8743a'); break;

function drawEntity(e){
  if(!e.alive){
    if(e.deathFx>0){
      const f=Math.max(0,e.deathFx/0.5);
      ctx.save(); ctx.globalAlpha=f; ctx.translate(e.x,e.y); ctx.rotate(e.angle+(1-f)*7);
      const sc=0.5+f*0.9; ctx.scale(sc,sc);
      drawHead(e,f>0.55);
      ctx.restore();
    }
    if(isFinite(e.deathTimer)){
      ctx.font='bold 14px Arial'; ctx.textAlign='center';
      outlineText(Math.ceil(e.deathTimer)+'s', e.x, e.y, 'rgba(255,255,255,.85)', 3);
    }
    return;
  }
  let alpha=1;
  if(e.invisible){
    if(e!==player){ if(!canSense(player,e)) return; alpha=0.4; }
    else alpha=0.6;
  } else if(e.inBush){
    if(e!==player && !canSense(player,e)) return;
    alpha = e===player? 0.65 : 0.5;
  }
  const rel=relationColor(e);
  const mv=(e.lastX===undefined)?0:Math.hypot(e.x-e.lastX,e.y-e.lastY);
  e.lastX=e.x; e.lastY=e.y;
  e.walk=(e.walk||0)+mv*0.22;
  const bob = mv>0.3 ? 1+0.06*Math.sin(e.walk) : 1+0.02*Math.sin(performance.now()/380+e.id);
  ctx.save();

  ctx.beginPath(); ctx.ellipse(e.x,e.y+e.radius*0.35,e.radius*1.45,e.radius*0.85,0,0,TAU);
  ctx.fillStyle=rel+'33'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=rel; ctx.stroke();

  if(e.superCharge>=e.superMax){
    const pulse=4+Math.sin(performance.now()/120)*3;
    withGlow('#ffe38a',12,()=>{
      ctx.beginPath(); ctx.arc(e.x,e.y,e.radius+10+pulse,0,TAU);
      ctx.strokeStyle='rgba(255,227,138,.9)'; ctx.lineWidth=3; ctx.stroke();

    ctx.lineTo(e.x+Math.cos(e.angle)*600, e.y+Math.sin(e.angle)*600);

  }

  ctx.beginPath(); ctx.ellipse(e.x,e.y+e.radius*0.8,e.radius*0.95,e.radius*0.4,0,0,TAU);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fill();
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.rotate(e.angle);
  if(e.slamTimer>0){ const k=1+0.28*Math.sin((1-e.slamTimer/0.22)*Math.PI); ctx.scale(k,k); }
  ctx.scale(bob,bob);
  ctx.save();

  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(10,8,6,.85)';
  drawWeaponShape(e.brawlerData, e.flashTimer>0);
  ctx.restore();
  drawHead(e,e.flashTimer>0);
  if(e.shield){ ctx.beginPath(); ctx.arc(0,0,e.radius+5,0,TAU); ctx.strokeStyle='rgba(120,200,255,.8)'; ctx.lineWidth=2; ctx.stroke(); }
  if(e.boostSpeed){
    ctx.beginPath(); ctx.arc(0,0,e.radius+9+Math.sin(performance.now()/90)*2,0,TAU);
    ctx.strokeStyle='rgba(255,207,107,.6)'; ctx.lineWidth=2; ctx.stroke();
  }
  if(e.slowTimer>0){
    ctx.beginPath(); ctx.arc(0,0,e.radius+7,0,TAU);
    ctx.strokeStyle='rgba(102,224,255,.75)'; ctx.lineWidth=2; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  }
  if(e.poisonTimer>0){
    const pulse=Math.sin(performance.now()/110)*1.5;

      ctx.beginPath(); ctx.arc(0,0,e.radius+9+pulse,0,TAU);
      ctx.strokeStyle='rgba(178,102,255,.8)'; ctx.lineWidth=2; ctx.setLineDash([2,4]); ctx.stroke(); ctx.setLineDash([]);

  }
  ctx.restore();

  const bw=Math.max(48,e.radius*3.3), bh=10, bx=e.x-bw/2, by=e.y-e.radius-24;
  const frac=Math.max(0,Math.min(1,e.hp/e.maxHp));

  outlineText(e.name,e.x,by-4,'#ffffff',3);
  rrPath(bx-2,by-2,bw+4,bh+4,6); ctx.fillStyle='#14110f'; ctx.fill();
  rrPath(bx,by,bw,bh,4); ctx.fillStyle='#3b3b3b'; ctx.fill();

    rrPath(bx+1,by+1,Math.max(6,bw*frac-2),bh*0.4,3); ctx.fillStyle='rgba(255,255,255,.28)'; ctx.fill();
  }
  ctx.font='bold 9px Arial';
  outlineText(String(Math.ceil(e.hp)),e.x,by+bh-1.5,'#ffffff',2.5);
  if(e===player){
    const n=e.brawlerData.ammoMax, gap=3, segW=(bw-(n-1)*gap)/n, y0=e.y+e.radius+12;
    const regen=1-Math.max(0,Math.min(1,e.ammoRegenTimer/(e.brawlerData.reload*1.3+0.3)));

      const x0=bx+k*(segW+gap);

      rrPath(x0,y0,segW,6,2.5); ctx.fillStyle='#4a3520'; ctx.fill();
      if(k<e.ammo){ rrPath(x0,y0,segW,6,2.5); ctx.fillStyle='#ffa733'; ctx.fill(); }
      else if(k===e.ammo && regen>0.05){ rrPath(x0,y0,Math.max(3,segW*regen),6,2.5); ctx.fillStyle='#ffa733'; ctx.fill(); }
    }
  }
  if(e.gems>0){
    ctx.save(); ctx.translate(bx-12,by+5); ctx.rotate(Math.PI/4);
    ctx.fillStyle='#b967ff'; ctx.strokeStyle='#14110f'; ctx.lineWidth=2; ctx.beginPath(); ctx.rect(-6,-6,12,12); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.font='bold 10px Arial'; outlineText(String(e.gems),bx-12,by+9,'#fff',2.5);
  }
  if(mode==='showdown' && e.cubes>0){
    ctx.save(); ctx.translate(bx-12,by+5); ctx.rotate(Math.PI/4);
    ctx.fillStyle='#8be34a'; ctx.strokeStyle='#14110f'; ctx.lineWidth=2; ctx.beginPath(); ctx.rect(-6,-6,12,12); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.font='bold 10px Arial'; outlineText(String(e.cubes),bx-12,by+9,'#fff',2.5);
  }
  ctx.restore();
}
let worldVignette=null, decor=null;
function getWorldVignette(){
  if(!worldVignette){
    worldVignette=ctx.createRadialGradient(CX,CY,300,CX,CY,Math.max(W,H)*0.72);
    worldVignette.addColorStop(0,'rgba(0,0,0,0)');
    worldVignette.addColorStop(1,'rgba(0,0,0,0.28)');
  }
  return worldVignette;
}
function getDecor(){
  if(!decor){
    decor=[];
    for(let i=0;i<130;i++){
      const x=rand(30,W-30), y=rand(30,H-30);
      let blocked=false;
      for(const r of activePillars){ if(x>r.x-14&&x<r.x+r.w+14&&y>r.y-14&&y<r.y+r.h+14){ blocked=true; break; } }
      if(!blocked){ for(const r of activeBushes){ if(x>r.x-14&&x<r.x+r.w+14&&y>r.y-14&&y<r.y+r.h+14){ blocked=true; break; } } }
      if(blocked) continue;
      decor.push({x,y,r:rand(2,5),kind:Math.random()<0.6?'dot':'crack',rot:rand(0,Math.PI*2)});
    }
  }
  return decor;
